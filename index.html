<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Go-Chipta — konsert, teatr, kino, sport va sayohat chiptalari</title>

<meta property="og:type" content="website">
<meta property="og:site_name" content="Go-Chipta">
<meta property="og:title" content="Go-Chipta — chiptalar bir joyda">
<meta property="og:description" content="Konsert, teatr, kino, sport, aviachipta va poyezd chiptalari. Joyni tanlang, QR kodli chiptani oling.">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#6D3BF5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M6 9h28a3 3 0 0 1 3 3v4a4 4 0 0 0 0 8v4a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-4a4 4 0 0 0 0-8v-4a3 3 0 0 1 3-3z' fill='%236D3BF5'/%3E%3Cpath d='M10 20h11M17 15.5l4.5 4.5-4.5 4.5' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
@property --a1{syntax:"<color>";inherits:true;initial-value:#6D3BF5}
@property --a2{syntax:"<color>";inherits:true;initial-value:#9B7BFF}
@property --a3{syntax:"<color>";inherits:true;initial-value:#F5B83D}
@property --a4{syntax:"<color>";inherits:true;initial-value:#3B1C9E}
:root{
  --bg:#F4F2FA; --surface:#FFFFFF; --surface2:#F7F5FC; --ink:#16122A; --muted:#625C7A; --line:#E3DEF0;
  --brand:#6D3BF5; --brand-ink:#FFFFFF; --hot:var(--brand); --deep:#2A1270; --sun:#FFB21A; --sun-ink:#2B1A00;
  --good:#0E9F6E; --warn:#C2410C; --glass:rgba(255,255,255,.72); --shadow:0 12px 32px rgba(40,20,90,.10);
  --aur:.38; --sk:#ECE8F6; --overlay:rgba(16,10,40,.55);
  /* Palitra: brend binafsha + amber urg'u + neytral ranglar (+ yashil/qizil faqat holat uchun) */
  --c-konsert:var(--brand); --c-teatr:var(--brand); --c-kino:var(--brand); --c-sport:var(--brand); --c-bolalar:var(--brand);
  --c-muzey:var(--brand); --c-show:var(--brand); --c-avia:var(--brand); --c-poyezd:var(--brand); --bad:#DC2626;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --display:"Unbounded","Onest",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0A1A; --surface:#17132A; --surface2:#1F1A36; --ink:#F1EEFB; --muted:#A29CBF; --line:#2C2648;
    --brand:#9B7BFF; --brand-ink:#0D0A1A; --good:#34D399; --warn:#FB923C; --glass:rgba(23,19,42,.74);
    --shadow:0 14px 36px rgba(0,0,0,.45); --aur:.5; --sk:#221C3B; --overlay:rgba(5,3,15,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0A1A; --surface:#17132A; --surface2:#1F1A36; --ink:#F1EEFB; --muted:#A29CBF; --line:#2C2648;
  --brand:#9B7BFF; --brand-ink:#0D0A1A; --good:#34D399; --warn:#FB923C; --glass:rgba(23,19,42,.74);
  --shadow:0 14px 36px rgba(0,0,0,.45); --aur:.5; --sk:#221C3B; --overlay:rgba(5,3,15,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:130px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;
  --a1:#6D3BF5;--a2:#9B7BFF;--a3:#F5B83D;--a4:#3B1C9E;transition:--a1 .9s,--a2 .9s,--a3 .9s,--a4 .9s}
h1,h2,h3{margin:0;font-family:var(--display);letter-spacing:-0.01em;line-height:1.15}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
#app:focus{outline:none}
.flink{background:none;border:0;padding:0;color:var(--muted);font-size:14px;text-align:left}
.flink:hover{color:var(--ink)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
svg{flex-shrink:0}

/* ---------- Butun sahifa foni ---------- */
/* Fon barcha sahifalarda bir xil brend ranglarida (bo'limlar ikonkalar bilan ajraladi) */
.aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;opacity:var(--aur);will-change:transform}
.aurora .b1{left:-22vmax;top:-26vmax;background:radial-gradient(circle,var(--a1) 0%,transparent 62%);animation:d1 26s ease-in-out infinite alternate}
.aurora .b2{right:-24vmax;top:-12vmax;background:radial-gradient(circle,var(--a2) 0%,transparent 62%);animation:d2 30s ease-in-out infinite alternate}
.aurora .b3{left:-14vmax;bottom:-30vmax;background:radial-gradient(circle,var(--a3) 0%,transparent 60%);animation:d3 34s ease-in-out infinite alternate;opacity:calc(var(--aur) * .8)}
.aurora .b4{right:-20vmax;bottom:-28vmax;background:radial-gradient(circle,var(--a4) 0%,transparent 60%);animation:d1 38s ease-in-out infinite alternate-reverse;opacity:calc(var(--aur) * .8)}
@keyframes d1{to{transform:translate(9vmax,7vmax) scale(1.12)}}
@keyframes d2{to{transform:translate(-10vmax,9vmax) scale(.92)}}
@keyframes d3{to{transform:translate(12vmax,-8vmax) scale(1.08)}}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.3px);background-size:24px 24px;
  mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.35) 60%,#000 100%);-webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.35) 60%,#000 100%)}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--glass);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em;flex-shrink:0}
.logo svg{width:38px;height:38px}
.qbox{flex:1;max-width:460px;position:relative;margin-left:8px}
.qbox input{width:100%;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 16px 0 44px}
.qbox>svg{position:absolute;left:15px;top:12px;width:20px;height:20px;color:var(--muted);pointer-events:none}
.qdrop{position:absolute;left:0;right:0;top:50px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px;max-height:70vh;overflow:auto}
.qdrop a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;text-decoration:none}
.qdrop a:hover,.qdrop a.on{background:var(--surface2)}
.qdrop .qt{font-weight:600;font-size:14px;line-height:1.25}
.qdrop small{display:block;color:var(--muted);font-size:12px}
.qdrop .qth{width:34px;height:46px;border-radius:7px;overflow:hidden;flex-shrink:0}
.qdrop .qth svg{width:100%;height:100%;display:block}
.qdrop .qnone{padding:12px;color:var(--muted);font-size:14px}
.tools-r{display:flex;align-items:center;gap:8px;margin-left:auto}
.sel{height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:14px;max-width:170px}
.langs{display:inline-flex;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px}
.langs button{border:0;background:transparent;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ibtn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;text-decoration:none}
.ibtn svg{width:20px;height:20px}
.ibtn .dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--sun);color:var(--sun-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.qbtn{display:none}
.catnav{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.catnav::-webkit-scrollbar{display:none}
.catnav a{flex-shrink:0;display:flex;align-items:center;gap:7px;text-decoration:none;font-weight:600;font-size:14px;padding:7px 13px 7px 9px;border-radius:999px;color:var(--muted);border:1px solid transparent}
.catnav a i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 16%,transparent);color:var(--cc)}
.catnav a i svg{width:15px;height:15px}
.catnav a:hover{color:var(--ink);background:var(--surface)}
.catnav a[aria-current="page"]{color:var(--ink);background:var(--surface);border-color:color-mix(in srgb,var(--cc) 45%,var(--line))}
.catnav a[aria-current="page"] i{background:var(--cc);color:#fff}

/* ---------- Umumiy ---------- */
main{min-height:60vh;padding-bottom:40px}
.sec{margin-top:52px;position:relative}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(20px,2.4vw,26px);font-weight:700}
.sec-h p{margin:6px 0 0;color:var(--muted)}
.more{font-weight:600;color:var(--brand);text-decoration:none;display:inline-flex;align-items:center;gap:4px;padding:6px 2px}
.more svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;background:color-mix(in srgb,var(--cc,var(--brand)) 14%,transparent);color:color-mix(in srgb,var(--cc,var(--brand)) 80%,var(--ink))}
.chip.solid{background:var(--cc,var(--brand));color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;min-height:48px;padding:0 22px;font-weight:700;text-decoration:none;background:var(--sun);color:var(--sun-ink);font-size:16px}
.btn:hover{filter:brightness(.97)}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;border:1px solid color-mix(in srgb,currentColor 35%,transparent);color:inherit}
.btn.brand{background:var(--brand);color:var(--brand-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:20px;height:20px}
.heart{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(10,6,25,.45);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.heart svg{width:19px;height:19px}
.heart[aria-pressed="true"] svg{fill:var(--hot);stroke:var(--hot)}
.heart.lg{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-lg);padding:40px 20px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:14px}
.sk{border-radius:18px;background:var(--sk);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.note{color:var(--muted);font-size:14px;text-align:center;margin-top:26px}
.price b{font-weight:700}
.scroller{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(176px,206px);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;scrollbar-width:thin}
.scroller>*{scroll-snap-align:start}
.poster-art{position:relative;overflow:hidden;background:var(--sk)}
.poster-art>svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- Hero karusel ---------- */
.hero{position:relative;margin-top:22px;border-radius:28px;overflow:hidden;height:440px;color:#fff;box-shadow:var(--shadow);isolation:isolate}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s}
.slide.on{opacity:1;visibility:visible}
.slide .bgart{position:absolute;inset:-30px;filter:blur(2px) saturate(1.15)}
.slide .bgart svg{width:100%;height:100%;display:block}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,4,24,.86) 0%,rgba(8,4,24,.55) 45%,rgba(8,4,24,.05) 100%);z-index:0}
.slide-in{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:center;padding:40px 56px 60px}
.slide h2{font-size:clamp(28px,4vw,46px);font-weight:800;line-height:1.05;margin:14px 0 14px;max-width:14em;text-wrap:balance}
.slide .meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:rgba(255,255,255,.86);font-size:15px}
.slide .meta span{display:inline-flex;align-items:center;gap:7px}
.slide .meta svg{width:18px;height:18px;opacity:.85}
.slide .cta{display:flex;gap:10px;margin-top:24px;align-items:center;flex-wrap:wrap}
.slide .from{font-size:15px;color:rgba(255,255,255,.86);margin-left:6px}
.slide .from b{font-size:22px;color:#fff;font-family:var(--display)}
.slide .pcard{justify-self:center;width:min(210px,100%);margin-bottom:24px;aspect-ratio:2/3;border-radius:20px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.45);transform:rotate(3deg);position:relative;border:3px solid rgba(255,255,255,.85)}
.slide .pcard svg{width:100%;height:100%;display:block}
.hero-nav{position:absolute;left:56px;right:56px;bottom:22px;z-index:2;display:flex;align-items:center;gap:14px}
.dots{display:flex;gap:8px}
.dots button{width:34px;height:6px;border-radius:3px;border:0;background:rgba(255,255,255,.35);padding:0;position:relative;overflow:hidden}
.dots button[aria-current="true"]{background:rgba(255,255,255,.35)}
.dots button[aria-current="true"]::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:prog var(--dur,6s) linear forwards}
.hero.paused .dots button[aria-current="true"]::after{animation-play-state:paused}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.arrows{margin-left:auto;display:flex;gap:8px}
.arrows button{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.arrows svg{width:20px;height:20px}

/* ---------- Kategoriya plitalari ---------- */
.cats{display:grid;grid-template-columns:repeat(9,1fr);gap:12px}
.cat{position:relative;overflow:hidden;border-radius:20px;padding:16px 14px 14px;min-height:132px;text-decoration:none;color:#fff;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(150deg,color-mix(in srgb,var(--cc) 88%,#fff) 0%,var(--cc) 45%,color-mix(in srgb,var(--cc) 70%,#000) 100%);box-shadow:0 10px 24px color-mix(in srgb,var(--cc) 30%,transparent)}
.cat .ci{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.cat .ci svg{width:22px;height:22px}
.cat b{font-weight:700;font-size:14.5px;line-height:1.2}
.cat small{display:block;opacity:.85;font-size:12.5px;margin-top:2px}
.cat .bigi{position:absolute;right:-16px;bottom:-16px;width:84px;height:84px;opacity:.16}
.cat:hover{transform:translateY(-2px)}
.cat{transition:transform .2s}

/* ---------- Kunlar tasmasi ---------- */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:7px 14px;text-align:center;min-width:64px}
.days button b{display:block;font-family:var(--display);font-size:18px;line-height:1.1}
.days button small{display:block;color:var(--muted);font-size:12px}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days button[aria-pressed="true"] small{color:inherit;opacity:.75}

/* ---------- Poster karta ---------- */
.pc{position:relative;display:flex;flex-direction:column;text-decoration:none;min-width:0}
.pc .pw{position:relative}
.pc .poster-art svg{transition:transform .5s}
.pc:hover .poster-art svg{transform:scale(1.05)}
.pc .poster-art{aspect-ratio:2/3;border-radius:18px;box-shadow:0 10px 24px rgba(20,10,50,.14)}

.pc .dbadge{position:absolute;left:10px;top:10px;z-index:1;background:var(--surface);color:var(--ink);border-radius:12px;padding:5px 9px;text-align:center;line-height:1.05;min-width:46px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.pc .dbadge b{display:block;font-family:var(--display);font-size:19px}
.pc .dbadge small{font-size:11px;font-weight:600;color:var(--muted)}
.pc .heart{position:absolute;right:10px;top:10px;z-index:1}
.pc .tag{position:absolute;left:10px;bottom:10px;z-index:1}
.pc h3{font-family:inherit;font-size:16px;font-weight:700;margin:12px 0 3px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .v{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .price{margin-top:6px;font-size:14px}
.pc .price b{color:var(--brand)}
.fast{background:var(--sun);color:var(--sun-ink);font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px}
.grid-posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px 18px}

/* ---------- Bento ---------- */
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:210px;gap:16px}
.bc{position:relative;border-radius:22px;overflow:hidden;color:#fff;text-decoration:none;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;isolation:isolate}
.bc.big{grid-column:span 2;grid-row:span 2;padding:26px}
.bc.wide{grid-column:span 2}
.bc .poster-art{position:absolute;inset:0;z-index:-2}
.bc::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,0) 25%,rgba(6,3,20,.86) 100%)}
.bc h3{font-family:var(--display);font-size:17px;font-weight:700;margin:8px 0 4px;line-height:1.2}
.bc.big h3{font-size:clamp(22px,2.6vw,32px)}
.bc .m{font-size:13.5px;opacity:.88}
.bc .heart{position:absolute;right:14px;top:14px}
.bc .chip{align-self:flex-start;background:rgba(255,255,255,.2);color:#fff}
.bc .pr{margin-top:8px;font-weight:700}
.bc:hover .poster-art svg{transform:scale(1.04)}
.bc .poster-art svg{transition:transform .5s}

/* ---------- Sport ---------- */
.matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column}
.match .mtop{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:linear-gradient(90deg,color-mix(in srgb,var(--c-sport) 16%,transparent),transparent);font-size:13px;color:var(--muted);font-weight:600}
.match .mid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:16px}
.team{text-align:center;min-width:0}
.crest{width:58px;height:58px;margin:0 auto 8px;display:block}
.team b{display:block;font-size:14.5px;line-height:1.25}
.score{text-align:center;font-family:var(--display);line-height:1}
.score b{font-size:26px;display:block}
.score small{font-family:"Onest",sans-serif;font-size:12.5px;color:var(--muted);display:block;margin-top:6px}
.match .mbot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px dashed var(--line);font-size:14px}
.match .mbot b{color:var(--good)}
.match:hover{border-color:color-mix(in srgb,var(--c-sport) 50%,var(--line))}
.banner{display:grid;grid-template-columns:200px 1fr auto;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;text-decoration:none;padding-right:20px;margin-top:16px}
.banner .poster-art{height:130px}
.banner h3{font-family:var(--display);font-size:18px}
.banner p{margin:4px 0 0;color:var(--muted);font-size:14px}

/* ---------- Teatr afishasi ---------- */
.playbill{display:flex;flex-direction:column;gap:22px}
.pday{display:grid;grid-template-columns:110px 1fr;gap:18px;align-items:start}
.pdate{position:sticky;top:140px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 6px}
.pdate b{display:block;font-family:var(--display);font-size:38px;line-height:1;color:var(--c-teatr)}
.pdate span{display:block;font-weight:600;font-size:14px;margin-top:4px}
.pdate small{color:var(--muted);font-size:12.5px}
.prow{display:flex;flex-direction:column;gap:12px}
.pitem{display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;text-decoration:none}
.pitem .poster-art{aspect-ratio:2/3;border-radius:12px}
.pitem h3{font-family:var(--display);font-size:18px;font-weight:700}
.pitem .v{color:var(--muted);font-size:14px;margin-top:4px}
.pitem .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pitem .side{text-align:right;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.tbig{font-family:var(--display);font-size:24px}
.pitem:hover{border-color:color-mix(in srgb,var(--c-teatr) 50%,var(--line))}

/* ---------- Kino ---------- */
.films{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.film{display:grid;grid-template-columns:120px 1fr;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.film .poster-art{aspect-ratio:2/3;border-radius:12px}
.film h3{font-family:var(--display);font-size:18px;line-height:1.2}
.film h3 a{text-decoration:none}
.film .m{color:var(--muted);font-size:13.5px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.age{border:1px solid var(--line);border-radius:6px;padding:0 6px;font-weight:700;font-size:12px;color:var(--ink)}
.cin{margin-top:10px}
.cin b{font-weight:600;font-size:13.5px}
.cin small{color:var(--muted)}
.times{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.time{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:5px 10px;text-align:center;min-width:72px}
.time b{display:block;font-family:var(--display);font-size:16px;line-height:1.2}
.time small{color:var(--muted);font-size:11.5px;white-space:nowrap}
.time:hover{border-color:var(--c-kino)}

/* ---------- Bolalar ---------- */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.kid{position:relative;background:var(--surface);border-radius:28px;overflow:hidden;text-decoration:none;border:2px solid color-mix(in srgb,var(--c-bolalar) 35%,var(--line))}
.kid .poster-art{aspect-ratio:4/3;clip-path:ellipse(85% 95% at 50% 0%)}
.kid .kb{padding:6px 18px 18px}
.kid h3{font-family:var(--display);font-size:18px}
.kid .ageb{position:absolute;right:14px;top:14px;background:var(--sun);color:var(--sun-ink);font-family:var(--display);font-weight:800;border-radius:50%;width:54px;height:54px;display:grid;place-items:center;font-size:15px;transform:rotate(-8deg);box-shadow:0 6px 14px rgba(0,0,0,.18)}
.kid .m{color:var(--muted);font-size:14px;margin-top:4px}
.kid .pr{margin-top:10px;font-weight:700;color:var(--warn)}

/* ---------- Muzey ---------- */
.land{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.lc{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column}
.lc .poster-art{aspect-ratio:16/9}
.lc .lb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.lc h3{font-family:var(--display);font-size:17px;line-height:1.25}
.lc .m{color:var(--muted);font-size:14px}
.lc .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px}
.lc .row b{color:var(--c-muzey)}

/* ---------- Ko'ngilochar ---------- */
.mosaic{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:190px;gap:16px}
.mosaic .bc:nth-child(4n+1){grid-row:span 2}

/* ---------- Kategoriya sahifasi sarlavhasi ---------- */
.chero{position:relative;margin-top:22px;border-radius:28px;overflow:hidden;color:#fff;padding:34px 36px 30px;isolation:isolate;
  background:linear-gradient(125deg,color-mix(in srgb,var(--cc) 92%,#000) 0%,var(--cc) 50%,color-mix(in srgb,var(--cc) 65%,#fff) 130%)}
.chero .pat{position:absolute;inset:0;z-index:-1;opacity:.14}
.chero .pat svg{width:100%;height:100%}
.chero .ring{position:absolute;right:-60px;top:-80px;width:340px;height:340px;border-radius:50%;border:44px solid rgba(255,255,255,.12);z-index:-1}
.chero h1{font-size:clamp(26px,4vw,42px);font-weight:800}
.chero p{margin:8px 0 0;opacity:.9;max-width:44em}
.chero .cnt{display:inline-block;margin-top:14px;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px}
.filters{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin:22px 0 20px}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters .sel{height:38px}
.filters input[type=date]{height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
.count{margin-left:auto;color:var(--muted);font-size:14px}

/* ---------- Tadbir sahifasi ---------- */
.ehero{position:relative;margin-top:22px;border-radius:28px;overflow:hidden;color:#fff;isolation:isolate;min-height:400px}
.ehero .bgart{position:absolute;inset:-60px;z-index:-2;filter:blur(36px) saturate(1.3)}
.ehero .bgart svg{width:100%;height:100%}
.ehero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(8,4,24,.82),rgba(8,4,24,.45))}
.ehero-in{display:grid;grid-template-columns:260px 1fr;gap:36px;padding:36px;align-items:center}
.ehero .pcard{aspect-ratio:2/3;border-radius:20px;overflow:hidden;box-shadow:0 24px 50px rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.85)}
.ehero .pcard svg{width:100%;height:100%;display:block}
.ehero h1{font-size:clamp(26px,4vw,44px);font-weight:800;margin:12px 0}
.ehero .facts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.ehero .facts span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 12px;font-size:13.5px}
.ehero .where{display:flex;flex-direction:column;gap:6px;color:rgba(255,255,255,.88)}
.ehero .where span{display:inline-flex;align-items:center;gap:8px}
.ehero .where svg{width:18px;height:18px}
.ehero .acts{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.ehero .from{font-size:15px;color:rgba(255,255,255,.86);margin-right:8px}
.ehero .from b{display:block;font-family:var(--display);font-size:26px;color:#fff}
.back{display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,.85);text-decoration:none;font-weight:600;font-size:14px;background:none;border:0;padding:0}
.back svg{width:18px;height:18px}
.ebody{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;margin-top:24px;align-items:start}
.ebody>*,.card,.film>div,.sec{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px}
.card+.card{margin-top:18px}
.card h2{font-size:19px;margin-bottom:14px}
.card p{margin:0 0 10px}
.sbox .days{margin-bottom:12px}
.sgroup{margin-top:10px}
.sgroup>b{font-size:14px}
.sgroup>small{color:var(--muted)}
.stimes{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.stimes button{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 14px;min-width:82px}
.stimes button b{display:block;font-family:var(--display);font-size:17px}
.stimes button small{color:var(--muted);font-size:12px}
.stimes button[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface))}
.tiers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tiers li{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:15px}
.tiers li i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:8px;vertical-align:-1px}
.side-sticky{position:sticky;top:140px}
.picked-s{background:var(--surface2);border-radius:14px;padding:12px 14px;margin:16px 0;font-size:14.5px}
.vbox{display:flex;gap:14px;align-items:center}
.vmono{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:20px;flex-shrink:0}
.vbox small{display:block;color:var(--muted)}
.mbar{display:none}

/* ---------- Maskanlar ---------- */
.venues{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.venue{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;text-decoration:none}
.venue b{display:block;font-size:15px;line-height:1.25}
.venue small{color:var(--muted)}
.feats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.feat{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;position:relative;overflow:hidden}
.feat .fi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;margin-bottom:14px}
.feat .fi svg{width:24px;height:24px}
.feat b{display:block;font-size:16px;margin-bottom:4px}
.feat p{margin:0;color:var(--muted);font-size:14px}

/* ---------- Sayohat ---------- */
.trav{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tpanel{border-radius:24px;padding:22px;color:#fff;position:relative;overflow:hidden;isolation:isolate;text-decoration:none}
.tpanel.av{background:linear-gradient(135deg,var(--deep),#6D3BF5 60%,#9B7BFF)}
.tpanel.tr{background:linear-gradient(135deg,var(--deep),#5B2EE0 60%,#8B6CFF)}
.tpanel .big{position:absolute;right:-10px;top:-14px;width:150px;height:150px;opacity:.15;z-index:-1}
.tpanel h3{font-family:var(--display);font-size:20px}
.tpanel p{margin:4px 0 14px;opacity:.88;font-size:14px}
.routes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.route{display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);border-radius:14px;padding:10px 12px;text-decoration:none;color:#fff;text-align:left;font-size:14px}
.route b{font-weight:700}
.route small{opacity:.85}
.route:hover{background:rgba(255,255,255,.22)}
.routes.light .route{background:var(--surface);border-color:var(--line);color:var(--ink)}
.routes.light .route small{color:var(--muted);opacity:1}
.search{position:relative;z-index:2;background:var(--surface);color:var(--ink);border-radius:20px;padding:18px;margin-top:22px;border:1px solid var(--line);box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:minmax(0,1.3fr) 44px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end}
.grid2{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:10px;margin-top:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lbl{font-size:13px;color:var(--muted);font-weight:500}
.field select,.field input{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-height:48px}
.swap{height:48px;width:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.swap svg{width:20px;height:20px}
.err{margin:12px 0 0;color:var(--warn);font-weight:500}
.err:empty{display:none}
.route-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin:30px 0 14px}
.route-title h2{font-size:24px}
.route-title span{color:var(--muted)}
.picked{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--good);border-radius:14px;padding:12px 16px;margin:24px 0 0}
.picked small{display:block;color:var(--muted)}
.dates{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:16px}
.dates button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;min-width:0}
.dates button b{display:block;font-size:13px;font-weight:600}
.dates button small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.2em}
.dates button.cheap small{color:var(--good);font-weight:600}
.dates button[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.ttools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
.chk{display:flex;align-items:center;gap:8px;font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
.list{display:flex;flex-direction:column;gap:14px}
.ticket{display:grid;grid-template-columns:1fr 210px;background:var(--surface);border:1px solid var(--line);border-radius:18px;position:relative}
.ticket .main{padding:16px 20px}
.who{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.badge{width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.who b{color:var(--ink);font-weight:600}
.tl{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;margin-top:12px}
.tm{font-family:var(--display);font-weight:700;font-size:28px;line-height:1}
.tm sup{font-family:"Onest",sans-serif;font-size:12px;color:var(--warn);font-weight:600;margin-left:3px}
.pl{color:var(--muted);font-size:13px;margin-top:5px}
.tl .r{text-align:right}
.tmid{text-align:center;color:var(--muted);font-size:13px;min-width:0}
.tmid .ln{display:flex;align-items:center;gap:8px;margin:5px 0}
.tmid .ln i{flex:1;height:0;border-top:2px dotted var(--line)}
.tmid .ln svg{width:20px;height:20px;color:var(--brand)}
.tmid .st{color:var(--good);font-weight:600}
.tmid .st.one{color:var(--warn)}
.stub{border-left:2px dashed var(--line);padding:16px 18px;display:flex;flex-direction:column;justify-content:center;gap:6px;position:relative}
.stub::before,.stub::after{content:"";position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.stub::before{top:-11px;clip-path:inset(50% 0 0 0)}
.stub::after{bottom:-11px;clip-path:inset(0 0 50% 0)}
.tprice{font-family:var(--display);font-weight:700;font-size:23px;line-height:1}
.tprice small{font-family:"Onest",sans-serif;font-size:14px;font-weight:500;color:var(--muted)}
.sub{color:var(--muted);font-size:13px}
.left{color:var(--warn);font-size:13px;font-weight:600}
.pick{background:var(--brand);color:var(--brand-ink);border:0;border-radius:12px;padding:11px 14px;font-weight:600;margin-top:4px}
.link{background:none;border:0;color:var(--brand);font-weight:600;text-decoration:underline;padding:4px}

/* ---------- Dialog ---------- */
dialog{border:0;border-radius:24px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,94vw);max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog.wide{width:min(760px,96vw)}
dialog::backdrop{background:rgba(8,4,24,.62);backdrop-filter:blur(3px)}
.dlg{padding:22px}
.dlg h3{font-size:21px;font-weight:700;padding-right:44px}
.close{position:absolute;right:16px;top:16px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;width:36px;height:36px;font-size:18px;z-index:2}
.mini{color:var(--muted);font-size:14px}
.sum{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0}
.sum b{font-weight:600}
.sum hr{border:0;border-top:1px dashed var(--line);margin:9px 0}
.pax{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.pax legend{font-weight:600;padding:0 6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg .field{margin-top:10px}
.pay{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.pay label{border:1px solid var(--line);border-radius:12px;padding:9px 13px;cursor:pointer;font-weight:500;display:flex;gap:8px;align-items:center;background:var(--surface2);font-size:14.5px}
.pay input{accent-color:var(--brand)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 12px;gap:10px}
.total b{font-family:var(--display);font-size:24px}
.dlg .btn.full{width:100%}
.fail{color:var(--warn);font-weight:500;margin:8px 0 0}
.fail:empty{display:none}
.okc{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;margin:14px 0}
.okc .qr{width:150px;height:150px;border-radius:12px;border:1px solid var(--line)}
.code{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.08em;margin:4px 0}
.okmark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--good);color:#fff;font-size:16px;margin-right:8px;vertical-align:-4px}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.stack .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Zal sxemasi */
.hallwrap{overflow-x:auto;margin:14px -6px 0;padding:0 6px 6px}
.hall{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:max-content;margin:0 auto}
.screen{width:80%;min-width:240px;text-align:center;font-size:11px;letter-spacing:.3em;color:var(--muted);border-top:4px solid var(--brand);border-radius:50% 50% 0 0/16px 16px 0 0;padding-top:7px;margin-bottom:10px}
.zl{font-size:12px;color:var(--muted);font-weight:600;margin:8px 0 2px}
.hrow{display:flex;align-items:center;gap:6px}
.rl{width:18px;text-align:center;font-size:11px;color:var(--muted)}
.seats{display:flex;gap:4px}
.seat{width:26px;height:26px;border-radius:7px 7px 4px 4px;border:1.5px solid var(--zc,var(--brand));background:transparent;padding:0;font-size:10px;color:var(--muted)}
.seat.gap{margin-left:16px}
.seat[aria-pressed="true"]{background:var(--zc,var(--brand));color:#fff}
.seat:disabled{background:var(--line);border-color:var(--line);color:transparent;cursor:not-allowed}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:13px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:1.5px solid var(--zc,var(--brand))}
.legend i.sel{background:var(--brand)}
.legend i.tk{background:var(--line);border-color:var(--line)}
.selbar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);margin:14px -22px -22px;padding:14px 22px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:1}
.selbar .si{min-width:0;flex:1 1 200px}
.selbar .btn{min-width:160px}
/* Stadion */
.stad{width:100%;max-width:560px;display:block;margin:12px auto 0}
.stad .sec-g{cursor:pointer}
.stad .sec-g rect,.stad .sec-g path{transition:filter .15s}
.stad .sec-g:hover rect,.stad .sec-g:focus rect{filter:brightness(1.12)}
.stad .sec-g:focus{outline:none}
.stad .sec-g:focus-visible rect{stroke:var(--sun);stroke-width:4}
.stad .sec-g.on rect{stroke:var(--ink);stroke-width:4}
.stad .sec-g.out{cursor:not-allowed}
.stad text{pointer-events:none;font-family:"Onest",sans-serif}
.qrows{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.qrow{display:grid;grid-template-columns:14px 1fr auto auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface2)}
.qrow i{width:14px;height:14px;border-radius:4px}
.qrow b{display:block;font-size:15px}
.qrow small{color:var(--muted);font-size:13px}

/* ---------- SHA-256 (brauzer va server uchun bir xil; QR imzosi uchun) ---------- */
const sha256 = (() => {
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const enc = s => { const out = []; for (const ch of String(s)){ let c = ch.codePointAt(0);
    if (c < 0x80) out.push(c); else if (c < 0x800) out.push(0xC0 | c >> 6, 0x80 | c & 63);
    else if (c < 0x10000) out.push(0xE0 | c >> 12, 0x80 | c >> 6 & 63, 0x80 | c & 63);
    else out.push(0xF0 | c >> 18, 0x80 | c >> 12 & 63, 0x80 | c >> 6 & 63, 0x80 | c & 63); } return out; };
  return function(str){
    const b = enc(str), l = b.length * 8;
    b.push(0x80); while (b.length % 64 !== 56) b.push(0);
    for (let i = 7; i >= 0; i--) b.push(i > 3 ? 0 : (l >>> (i * 8)) & 255);
    let h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    const w = new Array(64), r = (x, n) => (x >>> n) | (x << (32 - n));
    for (let o = 0; o < b.length; o += 64){
      for (let i = 0; i < 16; i++) w[i] = (b[o + i * 4] << 24) | (b[o + i * 4 + 1] << 16) | (b[o + i * 4 + 2] << 8) | b[o + i * 4 + 3];
      for (let i = 16; i < 64; i++){ const s0 = r(w[i - 15], 7) ^ r(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = r(w[i - 2], 17) ^ r(w[i - 2], 19) ^ (w[i - 2] >>> 10); w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0; }
      let [a, bb, c, d, e, f, g, hh] = h;
      for (let i = 0; i < 64; i++){
        const t1 = (hh + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
        const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & bb) ^ (a & c) ^ (bb & c))) | 0;
        hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
      }
      h = [h[0] + a, h[1] + bb, h[2] + c, h[3] + d, h[4] + e, h[5] + f, h[6] + g, h[7] + hh].map(x => x | 0);
    }
    return h.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
  };
})();

/* =====================================================================
   UMUMIY MANTIQ — server (server.js) va brauzer uchun bitta kod.
   Narxlar, seanslar, zal/stadion sxemalari, sayohat takliflari va
   qaytarish qoidalari shu yerda; shuning uchun sayt ko'rsatgan narx va
   server hisoblagan narx doim bir xil bo'ladi.
   ===================================================================== */
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const isoShift = (base, n) => { const d = parse(base); return iso(new Date(d.getFullYear(), d.getMonth(), d.getDate() + n)); };
const dayDiff = (a, b) => Math.round((Date.UTC(...b.split("-").map((x, i) => i === 1 ? x - 1 : +x)) - Date.UTC(...a.split("-").map((x, i) => i === 1 ? x - 1 : +x))) / 864e5);
const hhmm = m => pad(Math.floor(m / 60) % 24) + ":" + pad(m % 60);
const toMin = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
function seed(str){ let h = 2166136261; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- Narxlar ---------- */
const P = (base, m) => Math.round(base * m / 1000) * 1000;
const SEAT_ZONES = {

/* vt — maskan turi (hall, theatre, cinema, arena, stadium, open, museum, club, tour) */
function modeOf(ev, vt){
  if (ev.types) return "types";
  if (vt === "hall" || vt === "theatre" || vt === "cinema") return "seats";
  if (vt === "arena" || vt === "stadium") return "zones";
  return "types";
}
function typeSet(ev, vt){ return ev.types ? TYPE_SETS[ev.types] : (TYPE_SETS[vt] || TYPE_SETS.open); }
function sectorsOf(ev){ return ev.fan ? SECTORS.concat([{id:"FAN", cls:"fan", x:150, y:80, w:160, h:140}]) : SECTORS; }
/* Narxlar ro'yxati (yorliqsiz): [{k, kind, price, color, d}] */
function tierList(ev, s, vt){
  const base = s.base, mode = modeOf(ev, vt);
  if (mode === "seats") return SEAT_ZONES[vt].map(z => ({k:z.k, kind:"zone", price:P(base, z.m), color:z.c}));
  if (mode === "zones") return (ev.fan ? ["vip","center","fan","side","end"] : ["vip","center","side","end"]).map(c => ({k:c, kind:"sector", price:P(base, SEC_CLASS[c].m), color:SEC_CLASS[c].c}));
  return typeSet(ev, vt).map((x, i) => ({k:x.k, kind:"type", d:x.d, price:P(base, x.m), color:TYPE_COLORS[i % 4]}));
}
function hallLayout(type, base){
  const rows = [];
  if (type === "cinema"){
    for (let r = 1; r <= 10; r++){ const z = r >= 9 ? SEAT_ZONES.cinema[1] : SEAT_ZONES.cinema[0]; rows.push({row:r, n:14, zone:z.k, price:P(base, z.m), color:z.c}); }
  } else {
    for (let r = 1; r <= 15; r++){
      const z = SEAT_ZONES.theatre[r <= 8 ? 0 : r <= 12 ? 1 : 2];
      rows.push({row:r, n:z.k === "parter" ? 12 : z.k === "amfi" ? 14 : 16, zone:z.k, price:P(base, z.m), color:z.c});
    }
  }
  return rows;
}
/* Namunaviy "allaqachon sotilgan" joylar (har seans uchun doim bir xil) */
function mockOccupied(sid, rows){
  const r = rng(seed("occ" + sid)), p = 0.12 + r() * 0.3, occ = new Set();
  rows.forEach(row => { for (let k = 1; k <= row.n; k++) if (r() < p) occ.add(row.row + "-" + k); });
  return occ;
}
function soldOutSectors(sid){ const r = rng(seed("so" + sid)), set = new Set(); SECTORS.forEach(x => { if (x.cls !== "vip" && r() < 0.14) set.add(x.id); }); return set; }

/* ---------- Seanslar ----------
   Tadbirda uch xil jadval bo'lishi mumkin:
   - sessions: [{date:"YYYY-MM-DD", time:"HH:MM", venue, hall?, base?}] — admin kiritgan aniq sanalar;
   - s: "2@19:00,9@19:00" — bugundan necha kun keyin (namunaviy ma'lumot);
   - d: "0-13@10:00,12:00" — har kuni;
   - film: kinoteatrlar bo'yicha avtomatik jadval. */
const SESS_CACHE = {};
function genSessions(ev, today){
  const key = ev.id + "|" + today + "|" + (ev.rev || 0);
  if (SESS_CACHE[key]) return SESS_CACHE[key];
  const out = [];
  const add = (date, min, venue, hall, base) => out.push({id:[ev.id, date, min, venue].join("|"), ev:ev.id, date, min, venue, hall:hall || 0, base});
  if (Array.isArray(ev.sessions) && ev.sessions.length){
    ev.sessions.forEach(x => add(x.date, toMin(x.time), x.venue || ev.venue, +x.hall || 0, +x.base || ev.price));
  } else if (ev.film){
    for (let d = 0; d < 7; d++) ["cin1","cin2","cin3"].forEach(v => {
      const date = isoShift(today, d), r = rng(seed(ev.id + v + date));
      if (r() < 0.35) return;
      const times = new Set(), n = 2 + Math.floor(r() * 3);
      for (let i = 0; i < n; i++) times.add(600 + Math.floor(r() * 26) * 30);
      const hall = 1 + Math.floor(r() * 5);
      [...times].forEach(m => add(date, m, v, hall, m >= 1080 ? 55000 : m < 720 ? 35000 : 45000));
    });
  } else {
    if (ev.s) ev.s.split(",").forEach(x => { const [d, tm] = x.split("@"); add(isoShift(today, +d), toMin(tm), ev.venue, 0, ev.price); });
    if (ev.d){
      const [range, times] = ev.d.split("@"), [a, b] = range.split("-").map(Number);
      for (let d = a; d <= b; d++) times.split(",").forEach(tm => add(isoShift(today, d), toMin(tm), ev.venue, 0, ev.price));
    }
  }
  out.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : x.min - y.min);
  return (SESS_CACHE[key] = out);
}
const isUpcoming = (date, min, today, nowMin) => date > today || (date === today && min > nowMin + 10);
const minutesUntil = (date, min, today, nowMin) => dayDiff(today, date) * 1440 + min - nowMin;

/* ---------- Sayohat ---------- */
function dist(a, b){
  const R = 6371, rad = x => x * Math.PI / 180;
  const dl = rad(b.la - a.la), dn = rad(b.lo - a.lo);
  const h = Math.sin(dl / 2) ** 2 + Math.cos(rad(a.la)) * Math.cos(rad(b.la)) * Math.sin(dn / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function localAt(date, min){ const [y, m, d] = date.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d, 0, min)).toISOString().slice(0, 16); }
const depMinOf = s => +s.slice(11, 13) * 60 + +s.slice(14, 16);

const HUBS_INTL = ["Istanbul","Moskva","Olmaota","Dubay"];
const HUBS_DOM = ["Toshkent","Samarqand","Navoiy"];
const TARIFFS = [{k:"lite", m:1, hand:8, bag:0}, {k:"std", m:1.18, hand:8, bag:20}, {k:"flex", m:1.42, hand:10, bag:23}];
const TR_WAGONS = {0:[1,2,3,4], 1:[5,6,7,8], 2:[9,10]};
const legPrice = (price, m) => Math.round(price * (m || 1) / 1000) * 1000;
function mockGen(mode, from, to, date, cls){
  const a = CITIES[from], b = CITIES[to], km = dist(a, b);
  const r = rng(seed(mode + from + to + date));
  const mult = TR_CLASSES[mode].mult[cls] || 1;
  const dow = parse(date).getDay(), wk = (dow === 0 || dow === 5 || dow === 6) ? 1.07 : 1;
  const out = [];
  if (mode === "avia"){
    const intl = !(a.uz && b.uz), cars = intl ? INTL_AIR[a.uz ? to : from] : DOM_AIR;
    const n = 6 + Math.floor(r() * 4);
    for (let i = 0; i < n; i++){
      const car = cars[Math.floor(r() * cars.length)], stops = r() < 0.25 ? 1 : 0;
      const lay = stops ? 60 + Math.floor(r() * 30) * 5 : 0;
      const d = Math.round((45 + km / 13 + (stops ? lay + 40 : 0)) / 5) * 5;
      const dep = Math.floor((300 + r() * 1000) / 5) * 5;
      const hubs = (intl ? HUBS_INTL : HUBS_DOM).filter(h => h !== from && h !== to);
      const base = (intl ? 1200000 + km * 280 : 180000 + km * 380) * (0.8 + r() * 0.5) * (stops ? 0.85 : 1) * wk;
      out.push({id:mode + i, carrier:car[0], code:car[1] + (100 + Math.floor(r() * 900)), depAt:localAt(date, dep), arrAt:localAt(date, dep + d), dur:d, stops,
        hub:stops ? hubs[Math.floor(r() * hubs.length)] : "", layover:lay, aircraft:AIRCRAFT[Math.floor(r() * AIRCRAFT.length)],
        seats:cls === 1 ? 1 + Math.floor(r() * 16) : 1 + Math.floor(r() * 40), price:Math.round(base * mult / 1000) * 1000, currency:"UZS", depMin:dep % 1440});
    }
  } else {
    const fastRoute = FAST_TRAIN.has(from) && FAST_TRAIN.has(to), road = km * 1.25;
    const names = fastRoute ? ["Afrosiyob","Sharq"] : ["Nasaf","Registon","Turon","Surxon","Xorazm"];
    const n = 4 + Math.floor(r() * 3);
    for (let i = 0; i < n; i++){
      const name = names[Math.floor(r() * names.length)], fast = name === "Afrosiyob";
      const speed = fast ? 150 : (name === "Sharq" ? 100 : 70);
      const d = Math.round((road / speed * 60 + 15 + r() * 20) / 5) * 5;
      const dep = Math.floor((330 + r() * 1050) / 5) * 5;
      const base = (25000 + road * (fast ? 260 : 150)) * (0.9 + r() * 0.3) * wk;
      const classes = [0, 1, 2].map(c => ({c, free:(fast && c === 1) ? 0 : Math.floor(r() * [150, 90, 30][c]), price:Math.round(base * TR_CLASSES.poyezd.mult[c] / 1000) * 1000}))
        .filter(x => !(fast && x.c === 1));
      const mine = classes.find(x => x.c === cls);
      if (!mine || !mine.free) continue;          // tezyurar poyezdda kupe yo'q yoki sinfda joy qolmagan
      out.push({id:mode + i, carrier:name, code:"No " + (700 + Math.floor(r() * 250)), depAt:localAt(date, dep), arrAt:localAt(date, dep + d), dur:d, stops:0,
        classes, amen:fast ? ["wifi","ac","cafe","socket"] : ["ac","tea"], seats:mine.free, price:mine.price, currency:"UZS", depMin:dep % 1440});
    }
  }
  return out;
}
const legKey = l => `tr|${l.code}|${l.depAt}`;
function planeLayout(cls){
  const rows = [];
  if (cls === 1) for (let r = 1; r <= 4; r++) rows.push({r, cols:["A","C","|","D","F"]});
  else for (let r = 6; r <= 29; r++) rows.push({r, cols:["A","B","C","|","D","E","F"], exit:r === 14 || r === 15});
  return rows;
}
function trainLayout(cls){
  if (cls === 0){ const rows = []; for (let r = 0; r < 15; r++) rows.push([r * 4 + 1, r * 4 + 2, "|", r * 4 + 3, r * 4 + 4]); return {kind:"seat", rows}; }
  const per = cls === 1 ? 4 : 2, comps = [];
  for (let c = 0; c < 9; c++){ const b = []; for (let k = 1; k <= per; k++) b.push(c * per + k); comps.push(b); }
  return {kind:"comp", comps, per};
}
function allSeatKeys(mode, cls){
  if (mode === "avia") return planeLayout(cls).flatMap(row => row.cols.filter(c => c !== "|").map(c => row.r + c));
  const cap = cls === 0 ? 60 : cls === 1 ? 36 : 18;
  return TR_WAGONS[cls].flatMap(w => Array.from({length:cap}, (_, i) => w + "-" + (i + 1)));
}
/* Sxemadagi bo'sh joylar soni taklifdagi "bo'sh joylar" soniga teng (sotilganlar hali ayrilmagan) */
function freeSeatsBase(leg, mode, cls){
  const all = allSeatKeys(mode, cls), r = rng(seed("trfree" + legKey(leg) + cls));
  for (let i = all.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
  const n = Math.min(all.length, typeof leg.seats === "number" && leg.seats > 0 ? leg.seats : Math.round(all.length * .5));
  return new Set(all.slice(0, n));
}

/* ---------- Qaytarish qoidalari ----------
   mins — boshlanishiga (jo'nashiga) qolgan daqiqalar. Natija: foiz (0 — qaytarib bo'lmaydi). */
function refundPct(t, mins){
  const h = mins / 60;
  if (h <= 0) return 0;
  if (t.kind === "event") return h >= 72 ? 100 : h >= 24 ? 50 : 0;
  if (t.mode === "avia") return t.tariff === "flex" ? (h >= 3 ? 100 : 0) : t.tariff === "std" ? (h >= 24 ? 50 : 0) : 0;
  return h >= 24 ? 100 : h >= 2 ? 50 : 0;
}

/* ---------- Telefon raqami ---------- */
function normPhone(p){
  let d = String(p || "").replace(/\D/g, "");
  if (d.length === 9) d = "998" + d;
  return /^\d{11,15}$/.test(d) ? d : "";
}
const maskPhone = d => d.length === 12 ? `+${d.slice(0, 3)} ${d.slice(3, 5)} ***-**-${d.slice(10)}` : "+" + d.slice(0, 4) + "***" + d.slice(-2);

/* =====================================================================
   BACKEND — server.js (SQLite) va brauzerdagi demo rejim (localStorage)
   uchun bitta kod. Barcha narxlar, joy band qilish, buyurtma, promokod,
   qaytarish, QR tekshiruvi va admin amallari shu yerda.
   Store interfeysi: get(coll,id) · put(coll,id,doc) · del(coll,id) · all(coll) · tx(fn)
   ===================================================================== */
const ROLES = ["user", "staff", "admin"];
const AGES = ["0+","3+","6+","12+","16+","18+"];
const ALNUM = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const bOk = (status, body) => ({status, body});
const bErr = (status, error, extra) => ({status, body:Object.assign({error}, extra || {})});
const clone = o => JSON.parse(JSON.stringify(o));
const str = (v, max) => (typeof v === "string" ? v.trim().slice(0, max) : "");
const isDate = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
const isTime = s => typeof s === "string" && /^([01]\d|2[0-3]):[0-5]\d$/.test(s);
const evTitle = (ev, lg) => ev.teams && TEAMS[ev.teams[0]] && TEAMS[ev.teams[1]] ? `${TEAMS[ev.teams[0]].n[lg]} — ${TEAMS[ev.teams[1]].n[lg]}` : ((ev.t && (ev.t[lg] || ev.t.uz)) || ev.id);

class Backend {
  constructor(store, opt){
    this.db = store;
    this.o = Object.assign({
      secret:"dev-secret", holdMin:10, payMin:20, otpDev:true, adminPhones:[], payment:"demo",
      sms:null, payUrl:null, flights:null, log:() => {},
      today:() => iso(new Date()), nowMin:() => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); },
      randomBytes:n => { const a = []; for (let i = 0; i < n; i++) a.push(Math.floor(Math.random() * 256)); return a; }
    }, opt || {});
    this.offerCache = new Map();
    this.lastClean = 0;
    this.seed();
  }
  rand(n, abc){ abc = abc || ALNUM; return Array.from(this.o.randomBytes(n), b => abc[b % abc.length]).join(""); }
  sig(id){ return sha256(this.o.secret + "|ticket|" + id).slice(0, 12); }
  seed(){
    const m = this.db.get("meta", "seed");
    if (m && m.v >= 1) return;
    this.db.tx(() => {
      SEED_EVENTS.forEach(e => this.db.put("events", e.id, Object.assign(clone(e), {active:true, rev:1})));
      Object.keys(SEED_VENUES).forEach(k => this.db.put("venues", k, Object.assign({id:k}, clone(SEED_VENUES[k]))));
      [{code:"GOCHIPTA10", type:"pct", value:10, minTotal:100000, until:"", maxUses:0, cats:[], perUser:false},
       {code:"BIRINCHI", type:"fix", value:20000, minTotal:50000, until:"", maxUses:0, cats:[], perUser:true},
       {code:"TALABA", type:"pct", value:15, minTotal:0, until:"", maxUses:0, cats:["muzey","teatr","kino"], perUser:false}]
        .forEach(p => this.db.put("promos", p.code, Object.assign(p, {uses:0, active:true})));
      this.db.put("meta", "seed", {v:1, at:new Date().toISOString()});
    });
  }

  /* ---------- yordamchilar ---------- */
  today(){ return this.o.today(); }
  now(){ return this.o.nowMin(); }
  venue(id){ return this.db.get("venues", id); }
  vt(ev, s){ const v = this.venue((s && s.venue) || ev.venue); return v ? v.type : ""; }
  session(sid){
    if (typeof sid !== "string" || sid.length > 120) return null;
    const ev = this.db.get("events", sid.split("|")[0]);
    if (!ev || !ev.active) return null;
    const s = genSessions(ev, this.today()).find(x => x.id === sid);
    return s ? {ev, s} : null;
  }
  user(ctx){
    if (!ctx || !ctx.token) return null;
    const ses = this.db.get("sessions", String(ctx.token).slice(0, 80));
    if (!ses || ses.exp < Date.now()) return null;
    return this.db.get("users", ses.user);
  }
  holder(ctx){ const u = this.user(ctx); return u ? "u:" + u.id : (ctx && ctx.cid ? "c:" + String(ctx.cid).slice(0, 40) : "anon"); }
  pubUser(u){ return u ? {id:u.id, phone:u.phone, name:u.name || "", role:u.role} : null; }
  booked(key){ return this.db.get("booked", key) || {seats:{}, counts:{}}; }
  takenSet(key, holder){
    const set = new Set(Object.keys(this.booked(key).seats));
    const now = Date.now();
    this.db.all("holds").forEach(h => { if (h.key === key && h.exp > now && h.holder !== holder) h.seats.forEach(k => set.add(k)); });
    return set;
  }
  cleanup(){
    const now = Date.now();
    if (now - this.lastClean < 15000) return;
    this.lastClean = now;
    this.db.tx(() => {
      this.db.all("holds").forEach(h => { if (h.exp < now - 60000) this.db.del("holds", h.id); });
      this.db.all("orders").forEach(o => { if (o.status === "pending" && o.payExp < now) this.cancelOrder(o, "timeout"); });
      this.db.all("sessions").forEach(s => { if (s.exp < now) this.db.del("sessions", s.id); });
    });
  }
  freeSeat(t){
    if (!t.key) return;
    const b = this.booked(t.key);
    if (t.seatKey && b.seats[t.seatKey] === t.id) delete b.seats[t.seatKey];
    if (t.unitKey) b.counts[t.unitKey] = Math.max(0, (b.counts[t.unitKey] || 0) - 1);
    this.db.put("booked", t.key, b);
  }
  cancelOrder(o, why){
    this.db.all("tickets").filter(t => t.order === o.id && t.status === "pending").forEach(t => { t.status = "cancelled"; this.db.put("tickets", t.id, t); this.freeSeat(t); });
    o.status = "cancelled"; o.cancelReason = why; this.db.put("orders", o.id, o);
  }

  /* ---------- marshrutlash ---------- */
  async handle(method, path, body, ctx){
    try {
      this.cleanup();
      body = body && typeof body === "object" ? body : {};
      const p = String(path || "").replace(/^\/+|\/+$/g, "").split("/").map(decodeURIComponent);
      const m = method.toUpperCase(), r = p[0], a = p[1], b = p[2];
      if (r === "config" && m === "GET") return bOk(200, {server:true, payment:this.o.payment, sms:!!this.o.sms, otpDev:!!this.o.otpDev, holdMin:this.o.holdMin, flights:!!this.o.flights});
      if (r === "catalog" && m === "GET") return this.catalog();
      if (r === "auth" && a === "otp" && m === "POST") return await this.otp(body);
      if (r === "auth" && a === "verify" && m === "POST") return this.verify(body, ctx);
      if (r === "auth" && a === "logout" && m === "POST"){ if (ctx && ctx.token) this.db.del("sessions", String(ctx.token).slice(0, 80)); return bOk(200, {ok:true}); }
      if (r === "me" && !a && m === "GET"){ const u = this.user(ctx); return u ? bOk(200, {user:this.pubUser(u)}) : bErr(401, "auth"); }
      if (r === "me" && !a && m === "PUT"){ const u = this.user(ctx); if (!u) return bErr(401, "auth"); u.name = str(body.name, 60); this.db.put("users", u.id, u); return bOk(200, {user:this.pubUser(u)}); }
      if (r === "me" && a === "orders" && m === "GET") return this.myOrders(ctx);
      if (r === "seats" && m === "GET"){ const key = str(body.show, 160); return bOk(200, {taken:key ? [...this.takenSet(key, this.holder(ctx))] : []}); }
      if (r === "holds" && !a && m === "POST") return this.hold(body, ctx);
      if (r === "holds" && a && !b && m === "DELETE"){ const h = this.db.get("holds", a); if (h && h.holder === this.holder(ctx)) this.db.del("holds", a); return bOk(200, {ok:true}); }
      if (r === "holds" && a && b === "renew" && m === "POST") return this.renew(a, ctx);
      if (r === "quote" && m === "POST") return this.quote(body, ctx);
      if (r === "orders" && !a && m === "POST") return this.order(body, ctx);
      if (r === "tickets" && a && b === "refund" && m === "POST") return this.refund(a, ctx);
      if (r === "scan" && m === "POST") return this.scan(body, ctx);
      if (r === "flights" && m === "GET") return await this.flights(body);
      if (r === "admin") return this.admin(m, a, b, body, ctx);
      return bErr(404, "not_found");
    } catch (e) {
      this.o.log("backend xatosi:", e && e.stack || e);
      return bErr(500, "server");
    }
  }

  catalog(){
    const venues = {};
    this.db.all("venues").forEach(v => { venues[v.id] = v; });
    return bOk(200, {events:this.db.all("events").filter(e => e.active), venues, today:this.today()});
  }

  /* ---------- kirish: SMS kod ---------- */
  async otp(body){
    const phone = normPhone(body.phone);
    if (!phone) return bErr(400, "phone");
    const now = Date.now(), rec = this.db.get("otp", phone) || {sent:[]};
    rec.sent = (rec.sent || []).filter(x => x > now - 3600e3);
    if (rec.sent.length >= 5) return bErr(429, "otp_limit");
    if (rec.sent.length && now - rec.sent[rec.sent.length - 1] < 30e3) return bErr(429, "otp_wait");
    const code = Array.from(this.o.randomBytes(6), b => b % 10).join("");
    rec.hash = sha256(this.o.secret + "|otp|" + phone + "|" + code); rec.exp = now + 5 * 60e3; rec.tries = 0; rec.sent.push(now);
    this.db.put("otp", phone, rec);
    if (this.o.sms){ try { await this.o.sms(phone, `Go-Chipta: kirish kodi ${code}. Hech kimga aytmang.`); } catch (e) { this.o.log("SMS yuborilmadi:", e.message); if (!this.o.otpDev) return bErr(502, "sms_failed"); } }
    else this.o.log(`[OTP] +${phone}: ${code}`);
    return bOk(200, Object.assign({sent:true}, this.o.otpDev ? {dev:code} : {}));
  }
  verify(body, ctx){
    const phone = normPhone(body.phone), code = String(body.code || "").replace(/\D/g, "");
    const rec = phone && this.db.get("otp", phone);
    if (!rec || !rec.hash || rec.exp < Date.now()) return bErr(400, "otp_expired");
    if (rec.tries >= 5) return bErr(429, "otp_tries");
    if (sha256(this.o.secret + "|otp|" + phone + "|" + code) !== rec.hash){ rec.tries++; this.db.put("otp", phone, rec); return bErr(400, "otp_wrong"); }
    rec.hash = ""; this.db.put("otp", phone, rec);
    let u = this.db.get("users", phone);
    if (!u) u = {id:phone, phone, name:"", role:"user", createdAt:new Date().toISOString()};
    if (this.o.adminPhones.includes(phone)) u.role = "admin";
    this.db.put("users", phone, u);
    /* kirishdan oldin band qilingan joylar endi shu foydalanuvchiniki */
    if (ctx && ctx.cid){ const was = "c:" + String(ctx.cid).slice(0, 40); this.db.all("holds").forEach(h => { if (h.holder === was){ h.holder = "u:" + phone; this.db.put("holds", h.id, h); } }); }
    const token = this.rand(40, "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789");
    this.db.put("sessions", token, {id:token, user:phone, exp:Date.now() + 30 * 864e5});
    return bOk(200, {token, user:this.pubUser(u)});
  }

  /* ---------- joyni vaqtincha band qilish ---------- */
  seatCheck(key, seats, holder, leg){
    if (!Array.isArray(seats) || !seats.length || seats.length > 9 || new Set(seats).size !== seats.length) return "seats";
    if (key.startsWith("tr|")){
      const f = leg && this.findOffer(leg.mode, leg.cls, leg);
      if (!f || legKey(f) !== key) return "offer_gone";
      const free = freeSeatsBase(f, leg.mode, leg.cls);
      if (seats.some(k => typeof k !== "string" || !free.has(k))) return "seat_taken";
    } else {
      const x = this.session(key);
      if (!x || !isUpcoming(x.s.date, x.s.min, this.today(), this.now())) return "show_gone";
      const vt = this.vt(x.ev, x.s);
      if (modeOf(x.ev, vt) !== "seats") return "seats";
      const rows = hallLayout(vt, x.s.base), occ = mockOccupied(x.s.id, rows);
      for (const k of seats){
        const mm = /^(\d{1,2})-(\d{1,2})$/.exec(k || ""); if (!mm) return "seats";
        const row = rows.find(rr => rr.row === +mm[1]);
        if (!row || +mm[2] < 1 || +mm[2] > row.n || occ.has(k)) return "seat_taken";
      }
    }
    const taken = this.takenSet(key, holder);
    if (seats.some(k => taken.has(k))) return "seat_taken";
    return "";
  }
  hold(body, ctx){
    const key = str(body.key, 160), seats = body.seats, holder = this.holder(ctx);
    const leg = body.leg ? {mode:body.leg.mode, cls:+body.leg.cls, from:body.leg.from, to:body.leg.to, date:body.leg.date, code:body.leg.code, depAt:body.leg.depAt} : null;
    let out;
    this.db.tx(() => {
      const err = this.seatCheck(key, seats, holder, leg);
      if (err){ out = bErr(409, err); return; }
      const h = {id:this.rand(14), key, seats:seats.slice(), holder, leg, exp:Date.now() + this.o.holdMin * 60e3};
      this.db.put("holds", h.id, h);
      out = bOk(200, {id:h.id, exp:h.exp});
    });
    return out;
  }
  renew(id, ctx){
    const h = this.db.get("holds", id), holder = this.holder(ctx);
    if (!h || h.holder !== holder) return bErr(404, "hold_gone");
    let out;
    this.db.tx(() => {
      const err = this.seatCheck(h.key, h.seats, holder, h.leg);
      if (err){ this.db.del("holds", id); out = bErr(409, err); return; }
      h.exp = Date.now() + this.o.holdMin * 60e3; this.db.put("holds", id, h);
      out = bOk(200, {id, exp:h.exp});
    });
    return out;
  }

  /* ---------- narxni server hisoblaydi ---------- */
  findOffer(mode, cls, leg){
    if (!leg || (mode !== "avia" && mode !== "poyezd") || !CITIES[leg.from] || !CITIES[leg.to] || leg.from === leg.to || !isDate(leg.date)) return null;
    if (!CITIES[leg.from][mode === "avia" ? "air" : "train"] || !CITIES[leg.to][mode === "avia" ? "air" : "train"]) return null;
    if (!Number.isInteger(cls) || cls < 0 || cls > (mode === "avia" ? 1 : 2)) return null;
    const ck = mode + "|" + cls + "|" + leg.code + "|" + leg.depAt, c = this.offerCache.get(ck);
    if (c && c.exp > Date.now()) return c.offer;
    if (mode === "avia" && this.o.flights) return null;      // haqiqiy rejimda faqat server qaytargan takliflar
    return mockGen(mode, leg.from, leg.to, leg.date, cls).find(o => o.code === leg.code && o.depAt === leg.depAt) || null;
  }
  priceItems(items, holder, user){
    if (!Array.isArray(items) || !items.length || items.length > 10) return {err:"items"};
    const today = this.today(), now = this.now(), out = [];
    for (const it of items){
      if (!it || typeof it !== "object") return {err:"items"};
      if (it.type === "event"){
        const x = this.session(it.show);
        if (!x || !isUpcoming(x.s.date, x.s.min, today, now)) return {err:"show_gone"};
        const {ev, s} = x, vt = this.vt(ev, s), mode = modeOf(ev, vt), key = s.id, lines = [];
        const seats = Array.isArray(it.seats) ? it.seats : [], units = Array.isArray(it.items) ? it.items : [];
        if (mode === "seats"){
          if (!seats.length || seats.length > 6 || units.length) return {err:"seats"};
          const keys = seats.map(z => z && Number.isInteger(z.row) && Number.isInteger(z.seat) ? z.row + "-" + z.seat : "");
          const e = this.seatCheck(key, keys, holder, null); if (e) return {err:e};
          const rows = hallLayout(vt, s.base);
          keys.forEach(k => { const [rr, ss] = k.split("-").map(Number), row = rows.find(q => q.row === rr); lines.push({seatKey:k, seat:{row:rr, seat:ss, zone:row.zone}, price:row.price}); });
        } else {
          if (seats.length || !units.length) return {err:"items"};
          const tl = tierList(ev, s, vt), qty = units.reduce((q, u) => q + (Number.isInteger(u && u.qty) ? u.qty : 0), 0);
          if (qty < 1 || qty > 10 || new Set(units.map(u => u.k)).size !== units.length) return {err:"qty"};
          const b = this.booked(key), so = soldOutSectors(s.id);
          for (const u of units){
            if (!Number.isInteger(u.qty) || u.qty < 1) return {err:"qty"};
            let price;
            if (mode === "zones"){ const sec = sectorsOf(ev).find(z => z.id === u.k); if (!sec) return {err:"items"}; if (so.has(sec.id)) return {err:"sold_out"}; price = P(s.base, SEC_CLASS[sec.cls].m); if ((b.counts[u.k] || 0) + u.qty > SECTOR_CAP) return {err:"sold_out"}; }
            else { const tt = tl.find(z => z.k === u.k); if (!tt) return {err:"items"}; price = tt.price; if ((b.counts[u.k] || 0) + u.qty > TYPE_CAP) return {err:"sold_out"}; }
            for (let i = 0; i < u.qty; i++) lines.push({unitKey:u.k, unit:{k:u.k, kind:mode === "zones" ? "sector" : "type"}, price});
          }
        }
        out.push({type:"event", cat:ev.cat, ev, s, key, lines, total:lines.reduce((q, l) => q + l.price, 0)});
      } else if (it.type === "travel"){
        const mode = it.mode, cls = it.cls, legs = it.legs, pax = it.pax;
        if (mode !== "avia" && mode !== "poyezd") return {err:"items"};
        const tf = mode === "avia" ? TARIFFS.find(f => f.k === it.tariff) : null;
        if (mode === "avia" ? !tf : it.tariff != null) return {err:"items"};
        if (!Array.isArray(pax) || pax.length < 1 || pax.length > 9) return {err:"pax"};
        for (const p of pax) if (!p || !str(p.n, 60) || !str(p.s, 60) || !/^[A-Z]{2}\d{7}$/.test(p.p || "")) return {err:"pax"};
        if (!Array.isArray(legs) || legs.length < 1 || legs.length > 2) return {err:"items"};
        const lines = [], offers = [];
        for (let li = 0; li < legs.length; li++){
          const l = legs[li], f = this.findOffer(mode, cls, l);
          if (!f) return {err:"offer_gone"};
          if (l.date < today || (l.date === today && f.depMin <= now + 60)) return {err:"offer_gone"};
          if (f.seats < pax.length) return {err:"no_seats"};
          const st = Array.isArray(l.seats) ? l.seats : [];
          if (mode === "poyezd" ? st.length !== pax.length : (st.length && st.length !== pax.length)) return {err:"seats"};
          if (st.length){ const e = this.seatCheck(legKey(f), st, holder, {mode, cls, from:l.from, to:l.to, date:l.date, code:l.code, depAt:l.depAt}); if (e) return {err:e}; }
          offers.push(f);
          pax.forEach((p, pi) => lines.push({li, pi, seatKey:st[pi] || "", key:legKey(f), price:legPrice(f.price, tf ? tf.m : 1), offer:f, leg:l}));
        }
        if (legs.length === 2){
          const [a, b] = legs, after = new Date(Date.parse(offers[0].arrAt + ":00Z") + 2 * 3600e3).toISOString().slice(0, 16);
          if (b.from !== a.to || b.to !== a.from || offers[1].depAt < after) return {err:"items"};
        }
        out.push({type:"travel", cat:mode, mode, cls, tariff:tf ? tf.k : null, pax, lines, total:lines.reduce((q, l) => q + l.price, 0)});
      } else return {err:"items"};
    }
    return {items:out, subtotal:out.reduce((q, x) => q + x.total, 0)};
  }
  applyPromo(code, priced, user){
    code = str(code, 30).toUpperCase();
    if (!code) return {discount:0};
    const p = this.db.get("promos", code);
    if (!p || !p.active) return {err:"promo_invalid"};
    if (p.until && p.until < this.today()) return {err:"promo_expired"};
    if (p.maxUses && p.uses >= p.maxUses) return {err:"promo_limit"};
    if (p.perUser && user && this.db.all("orders").some(o => o.user === user.id && o.promo === code && o.status !== "cancelled")) return {err:"promo_used"};
    const elig = priced.items.filter(x => !p.cats || !p.cats.length || p.cats.includes(x.cat)).reduce((q, x) => q + x.total, 0);
    if (!elig) return {err:"promo_cats"};
    if (priced.subtotal < (p.minTotal || 0)) return {err:"promo_min", min:p.minTotal};
    const d = p.type === "pct" ? Math.round(elig * p.value / 100 / 1000) * 1000 : Math.min(p.value, elig);
    return {discount:d, code, promo:p};
  }
  quote(body, ctx){
    const user = this.user(ctx), priced = this.priceItems(body.items, this.holder(ctx), user);
    if (priced.err) return bErr(409, priced.err);
    const pr = this.applyPromo(body.promo, priced, user);
    const discount = pr.err ? 0 : pr.discount;
    return bOk(200, {items:priced.items.map(x => ({type:x.type, total:x.total, count:x.lines.length})), subtotal:priced.subtotal, discount, total:priced.subtotal - discount, promo:pr.err ? {error:pr.err, min:pr.min} : (pr.code ? {code:pr.code} : null)});
  }

  /* ---------- buyurtma ---------- */

    const payment = ["Payme","Click","Uzcard / Humo","Visa / Mastercard"].includes(body.payment) ? body.payment : "Payme";
    const holder = "u:" + user.id;
    let out;
    this.db.tx(() => {
      const priced = this.priceItems(body.items, holder, user);
      if (priced.err){ out = bErr(409, priced.err); return; }
      const pr = this.applyPromo(body.promo, priced, user);
      if (pr.err){ out = bErr(409, pr.err, {min:pr.min}); return; }
      const total = priced.subtotal - pr.discount, ratio = priced.subtotal ? total / priced.subtotal : 1;
      const pending = this.o.payment !== "demo";
      const order = {id:this.rand(12), code:this.rand(6), user:user.id, phone:user.phone, buyer, email, payment,

        status:pending ? "pending" : "paid", createdAt:new Date().toISOString(), day:this.today(), payExp:Date.now() + this.o.payMin * 60e3};
      const tickets = [];
      priced.items.forEach(x => x.lines.forEach(l => {
        const t = {id:this.rand(10), order:order.id, code:order.code, user:user.id, status:pending ? "pending" : "valid", price:l.price, paid:Math.round(l.price * ratio), cat:x.cat, createdAt:order.createdAt};
        if (x.type === "event"){
          Object.assign(t, {kind:"event", ev:x.ev.id, show:x.s.id, key:x.key, date:x.s.date, min:x.s.min, venue:x.s.venue, hall:x.s.hall, dur:x.ev.dur,
            title:{uz:evTitle(x.ev, "uz"), ru:evTitle(x.ev, "ru"), en:evTitle(x.ev, "en")}});
          if (l.seat){ t.seat = l.seat; t.seatKey = l.seatKey; } else { t.unit = l.unit; t.unitKey = l.unit.k; }
        } else {
          const f = l.offer, p = x.pax[l.pi];
          Object.assign(t, {kind:"travel", mode:x.mode, cls:x.cls, tariff:x.tariff, key:l.key, li:l.li, legs:x.lines.filter(q => q.pi === 0).length, pi:l.pi,
            from:l.leg.from, to:l.leg.to, date:l.leg.date, depAt:f.depAt, arrAt:f.arrAt, dur:f.dur, carrier:f.carrier, flight:f.code,
            pax:{n:str(p.n, 60), s:str(p.s, 60), p:p.p.slice(0, 2) + "*****" + p.p.slice(-2)}, seatKey:l.seatKey || ""});
          if (!t.seatKey) delete t.seatKey;
        }
        t.qr = `GC1|${t.id}|${this.sig(t.id)}`;
        tickets.push(t);
      }));
      order.items = priced.items.map(x => x.type === "event" ? {type:"event", ev:x.ev.id, show:x.s.id, count:x.lines.length, total:x.total}
        : {type:"travel", mode:x.mode, cls:x.cls, tariff:x.tariff, pax:x.pax.map(p => ({n:str(p.n, 60), s:str(p.s, 60), p:p.p})), legs:x.lines.filter(q => q.pi === 0).map(q => ({from:q.leg.from, to:q.leg.to, date:q.leg.date, flight:q.offer.code, depAt:q.offer.depAt})), count:x.lines.length, total:x.total});
      tickets.forEach(t => {
        const b = this.booked(t.key);
        if (t.seatKey) b.seats[t.seatKey] = t.id;
        if (t.unitKey) b.counts[t.unitKey] = (b.counts[t.unitKey] || 0) + 1;
        this.db.put("booked", t.key, b);
        this.db.put("tickets", t.id, t);
      });
      const used = new Set(tickets.map(t => t.key));
      this.db.all("holds").forEach(h => { if (h.holder === holder && used.has(h.key)) this.db.del("holds", h.id); });
      if (pr.promo){ pr.promo.uses = (pr.promo.uses || 0) + 1; this.db.put("promos", pr.promo.code, pr.promo); }
      this.db.put("orders", order.id, order);
      if (pending && this.o.payUrl) order.payUrl = this.o.payUrl(order);
      out = bOk(200, {order, tickets});
    });
    if (out.status === 200 && this.o.sms && out.body.order.status === "paid"){
      const o = out.body.order;
      Promise.resolve(this.o.sms(o.phone, `Go-Chipta: buyurtma ${o.code} tasdiqlandi. Chiptalar soni: ${out.body.tickets.length}.`)).catch(() => {});

    return out;
  }

  /* ---------- kirishda QR tekshiruvi ---------- */
  scan(body, ctx){
    const u = this.user(ctx);
    if (!u) return bErr(401, "auth");
    if (u.role !== "staff" && u.role !== "admin") return bErr(403, "forbidden");
    const raw = str(body.qr, 200);
    let id = "", m = /^GC1\|([A-Z0-9]{10})\|([0-9a-f]{12})$/.exec(raw);
    if (m){ if (this.sig(m[1]) !== m[2]) return bOk(200, {result:"invalid"}); id = m[1]; }
    else if (/^[A-Za-z0-9]{10}$/.test(raw)) id = raw.toUpperCase();
    else return bOk(200, {result:"invalid"});
    const t = this.db.get("tickets", id);
    if (!t) return bOk(200, {result:"invalid"});
    const info = this.ticketInfo(t);
    if (t.status === "used") return bOk(200, {result:"used", usedAt:t.usedAt, ticket:info});
    if (t.status !== "valid") return bOk(200, {result:t.status, ticket:info});
    if (t.date !== this.today() && !body.force) return bOk(200, {result:"wrong_day", ticket:info});
    t.status = "used"; t.usedAt = new Date().toISOString(); t.usedBy = u.id; t.usedDay = this.today();
    this.db.put("tickets", t.id, t);
    return bOk(200, {result:"ok", ticket:this.ticketInfo(t)});
  }

    const keep = ["id","code","kind","status","title","date","min","venue","hall","seat","unit","mode","cls","tariff","from","to","depAt","carrier","flight","pax","seatKey","usedAt","ev","cat"];
    const x = {}; keep.forEach(k => { if (t[k] !== undefined) x[k] = t[k]; });
    x.buyer = o.buyer || ""; x.phone = o.phone ? maskPhone(o.phone) : "";
    return x;
  }
