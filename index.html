            <a href="#/c/poyezd" ${mode === "poyezd" ? 'aria-current="page"' : ""}>${ico("poyezd")}${esc(catName("poyezd"))}</a>
          </nav>
          <h1>${esc(catName(mode))}</h1>
          <p>${esc(t("cd_" + mode))}</p>
          <div class="tstats" id="trStats">${routeStats(mode, F.from, F.to)}</div>
        </div>
        <div class="tmap" id="trMap">${routeMap(mode, F.from, F.to)}</div>
      </div>
    </section>
    <section class="search tsearch" aria-label="${esc(catName(mode))}">
      <div class="grid">
        <div class="field"><label for="trFrom">${esc(t("from"))}</label><select id="trFrom"></select></div>
        <button class="swap" id="trSwap" type="button" aria-label="${esc(t("swap"))}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg></button>
        <div class="field"><label for="trTo">${esc(t("to"))}</label><select id="trTo"></select></div>
        <div class="field"><label for="trDate">${esc(t("date"))}</label><input type="date" id="trDate" min="${TODAY_ISO}" value="${F.date}"></div>
        <div class="field"><label for="trRet">${esc(t("ret"))}</label><input type="date" id="trRet" min="${F.date}" value="${F.ret}"></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="trPax">${esc(t("pax"))}</label><select id="trPax">${[1,2,3,4,5,6].map(n => `<option value="${n}"${n === F.pax ? " selected" : ""}>${esc(t("paxN", n))}</option>`).join("")}</select></div>
        <div class="field"><label for="trCls">${esc(t("cls"))}</label><select id="trCls">${TR_CLASSES[mode][S.lang].map((n, i) => `<option value="${i}"${i === F.cls ? " selected" : ""}>${esc(n)}</option>`).join("")}</select></div>
        <button class="btn" id="trGo" type="button">${ico("search")}${esc(t("trSearch"))}</button>
      </div>
      <div class="recent" id="trRecent"></div>
      <p class="err" id="trErr" role="alert"></p>
    </section>
    <section class="card calcard" id="trCal"></section>
    <div id="trRes" aria-live="polite"></div>
    <section class="sec">
      <div class="sec-h"><h2>${esc(t("popRoutes"))}</h2><a class="more" href="#/c/${other}">${esc(catName(other))}${ico("right")}</a></div>
      <div class="rcards">${POP_ROUTES[mode].map(r => routeCard(mode, r)).join("")}</div>
    </section>
    <section class="sec">
      <div class="feats">${[["cal",BRAND],["seat",BRAND],[mode === "avia" ? "avia" : "poyezd", BRAND],["qr",BRAND]].map((f, i) => `<div class="feat"><span class="fi" style="background:${f[1]}">${ico(f[0])}</span><b>${esc(t("tf" + (i + 1) + "t_" + mode))}</b><p>${esc(t("tf" + (i + 1) + "_" + mode))}</p></div>`).join("")}</div>
    </section>
  </div>`;
}
function routeCard(mode, r){
  const [a, b] = r, pr = (S.api && mode === "avia") ? null : trMinPrice(mode, a, b, isoAdd(7));
  return `<button type="button" class="rcard" data-route="${mode}|${a}|${b}" style="--cc:${CAT_COLOR[mode]}">
    <span class="codes"><b>${esc(CITIES[a].code)}</b>${ico(mode)}<b>${esc(CITIES[b].code)}</b></span>
    <span class="names">${esc(cn(a))} → ${esc(cn(b))}</span>
    <span class="meta">${esc(durTxt(estDur(mode, a, b)))}</span>
    <span class="pr">${pr ? esc(fromTxt(pr)) : esc(t("seePrices"))}</span>
  </button>`;
}
function trFillCities(){
  const mode = T.mode, F = T[mode];
  const names = Object.keys(CITIES).filter(n => CITIES[n][mode === "avia" ? "air" : "train"]);
  if (!names.includes(F.from)) F.from = "Toshkent";
  if (!names.includes(F.to) || F.to === F.from) F.to = names.find(n => n !== F.from);
  const opt = n => `<option value="${esc(n)}">${esc(cn(n))} (${CITIES[n].code})</option>`;
  $("#trFrom").innerHTML = names.map(opt).join(""); $("#trTo").innerHTML = names.map(opt).join("");
  $("#trFrom").value = F.from; $("#trTo").value = F.to;
}
function trReadForm(){
  const F = T[T.mode];
  F.from = $("#trFrom").value; F.to = $("#trTo").value; F.date = $("#trDate").value; F.ret = $("#trRet").value;
  F.pax = +$("#trPax").value; F.cls = +$("#trCls").value;
}
function trMapUpdate(){
  const F = T[T.mode];
  if (!CITIES[F.from] || !CITIES[F.to]) return;
  $("#trMap").innerHTML = routeMap(T.mode, F.from, F.to);
  $("#trStats").innerHTML = routeStats(T.mode, F.from, F.to);
}
function bindTravel(mode){
  trFillCities();
  const onRoute = () => { trReadForm(); trMapUpdate(); renderCal(); };
  ["#trFrom","#trTo"].forEach(s => $(s).addEventListener("change", onRoute));
  $("#trRet").addEventListener("change", trReadForm);
  ["#trCls","#trPax"].forEach(s => $(s).addEventListener("change", () => { trReadForm(); renderCal(); if (T[mode].searched) trStart(false); }));
  $("#trDate").addEventListener("change", () => { $("#trRet").min = $("#trDate").value || TODAY_ISO; trReadForm(); renderCal(); });
  $("#trSwap").addEventListener("click", () => { const f = $("#trFrom").value; $("#trFrom").value = $("#trTo").value; $("#trTo").value = f; onRoute(); });
  $("#trGo").addEventListener("click", () => trStart(true));
  renderRecent();
  renderCal();
  if (T.pending === mode){ T.pending = null; setTimeout(() => { if (T.mode === mode && $("#trRes")) trStart(true); }, 80); }
  else if (T[mode].searched) trRender(false, true);
}
function trPreset(mode, a, b){
  const F = T[mode];
  F.from = a; F.to = b; F.ret = ""; F.searched = false;
  if (location.hash !== "#/c/" + mode){ T.pending = mode; location.hash = "#/c/" + mode; }
  else { trFillCities(); $("#trRet").value = ""; trMapUpdate(); trStart(true); }
}
function trStart(scroll){
  trReadForm();
  const F = T[T.mode], err = $("#trErr"); err.textContent = "";
  if (F.from === F.to){ err.textContent = t("errSame"); return; }
  if (!F.date || parse(F.date) < TODAY){ err.textContent = t("errDate"); return; }
  if (F.ret && parse(F.ret) < parse(F.date)){ err.textContent = t("errRet"); return; }
  if (T.mode === "avia" && !CITIES[F.from].uz && !CITIES[F.to].uz){ err.textContent = t("errIntl"); return; }
  Object.assign(T, {leg:0, picked:null, carrier:"", direct:false, tod:new Set(), open:new Set(), q:{cls:F.cls, pax:F.pax}});
  F.searched = true;
  const rec = [[F.from, F.to]].concat((store.get("recent:" + T.mode, []) || []).filter(r => !(r[0] === F.from && r[1] === F.to))).slice(0, 4);
  store.set("recent:" + T.mode, rec); renderRecent();
  trMapUpdate(); renderCal();
  trRender(scroll);
}

function renderRecent(){
  const box = $("#trRecent"); if (!box) return;
  const mode = T.mode, recent = (store.get("recent:" + mode, []) || []).filter(r => Array.isArray(r) && CITIES[r[0]] && CITIES[r[1]]).slice(0, 4);
  box.hidden = !recent.length;
  box.innerHTML = recent.length ? `<span>${esc(t("recent"))}:</span>${recent.map(r => `<button type="button" class="rchip" data-recent="${esc(r[0])}|${esc(r[1])}">${esc(cn(r[0]))} → ${esc(cn(r[1]))}</button>`).join("")}` : "";
  $$("[data-recent]", box).forEach(b => b.addEventListener("click", () => { const [a, c] = b.dataset.recent.split("|"); trPreset(mode, a, c); }));
}
/* ---------- Narxlar kalendari ---------- */
function renderCal(){
  const box = $("#trCal"); if (!box) return;
  const mode = T.mode, F = T[mode];
  const ret = F.searched && T.leg === 1;
  const leg = ret ? {from:F.to, to:F.from, date:F.ret, min:F.date} : {from:F.from, to:F.to, date:F.date, min:TODAY_ISO};
  if ((S.api && mode === "avia") || leg.from === leg.to || !CITIES[leg.from] || !CITIES[leg.to] || (mode === "avia" && !CITIES[leg.from].uz && !CITIES[leg.to].uz)){ box.hidden = true; return; }
  const cq = ret ? Q() : {cls:F.cls, pax:F.pax}, aft = ret ? afterIso() : "";
  box.hidden = false;
  const start = parse(leg.min), wd = (start.getDay() + 6) % 7;     // dushanbadan boshlanadi
  const first = new Date(start.getFullYear(), start.getMonth(), start.getDate() - wd);
  const cells = [];
  for (let i = 0; i < 35; i++){
    const d = new Date(first.getFullYear(), first.getMonth(), first.getDate() + i), s = iso(d);
    cells.push({s, d, off:s < leg.min, price:s < leg.min ? null : dayMin(mode, leg.from, leg.to, s, cq.cls, cq.pax, aft)});
  }
  const ps = cells.map(c => c.price).filter(p => p != null).sort((a, b) => a - b);
  const q1 = ps[Math.floor(ps.length / 3)], q2 = ps[Math.floor(ps.length * 2 / 3)];
  const lvl = p => p <= q1 ? "lo" : p <= q2 ? "mid" : "hi";
  const wdn = [1,2,3,4,5,6,0].map(i => CAL[S.lang].d[i]);
  box.innerHTML = `<div class="sec-h" style="margin-bottom:10px"><div><h2>${esc(t("calTitle"))}</h2><p>${esc(cn(leg.from))} → ${esc(cn(leg.to))} · ${esc(t("calSub"))}</p></div>
      <div class="clegend"><span><i class="lo"></i>${esc(t("calLo"))}</span><span><i class="mid"></i>${esc(t("calMid"))}</span><span><i class="hi"></i>${esc(t("calHi"))}</span></div></div>
    <div class="cal" role="group" aria-label="${esc(t("calTitle"))}">
      ${wdn.map(d => `<span class="cwd">${esc(d)}</span>`).join("")}
      ${cells.map(c => c.off ? `<span class="cday off" aria-hidden="true">${c.d.getDate()}</span>`
        : `<button type="button" class="cday ${c.price != null ? lvl(c.price) : ""}" data-cal="${c.s}" aria-pressed="${c.s === leg.date}" aria-label="${esc(longDate(c.s))}${c.price != null ? ", " + esc(fromTxt(c.price)) : ""}"><b>${c.d.getDate()}${c.d.getDate() === 1 || c.s === leg.min ? `<small> ${esc(CAL[S.lang].m[c.d.getMonth()])}</small>` : ""}</b><small>${c.price != null ? esc(shortPrice(c.price)) : "—"}</small></button>`).join("")}
    </div>`;
  $$("[data-cal]", box).forEach(b => b.addEventListener("click", () => {
    if (F.searched && T.leg === 1){ F.ret = b.dataset.cal; $("#trRet").value = F.ret; T.carrier = ""; renderCal(); trRender(true); }
    else { F.date = b.dataset.cal; $("#trDate").value = F.date; if (F.ret && F.ret < F.date){ F.ret = ""; $("#trRet").value = ""; } $("#trRet").min = F.date; trStart(true); }
  }));
}

/* ---------- Natijalar ---------- */
async function trRender(scroll, reuse){
  const mode = T.mode, F = T[mode], r = curLeg(), my = ++trSeq;
  const A = CITIES[r.from], Bc = CITIES[r.to];
  const ttl = F.ret ? t(T.leg === 0 ? "legOut" : "legBack") : "";
  const p = T.picked;
  const key = [mode, r.from, r.to, r.date, F.pax, F.cls, S.api].join("|");
  const note = S.api ? (mode === "avia" ? t("noteReal") : t("noteTrainApi")) : t("noteDemo", mode);
  const minDate = T.leg === 1 ? parse(F.date) : TODAY;
  const start = new Date(Math.max(minDate.getTime(), parse(r.date).getTime() - 3 * 864e5));
  const days = [];
  for (let i = 0; i < 7; i++){ const s = iso(new Date(start.getFullYear(), start.getMonth(), start.getDate() + i)); days.push({s, min:dayMin(mode, r.from, r.to, s, Q().cls, Q().pax, afterIso())}); }
  const known = days.map(x => x.min).filter(x => x !== null), cheapest = known.length ? Math.min(...known) : null;
  $("#trRes").innerHTML = `
    ${T.leg === 1 && p ? `<div class="picked"><div><small>${esc(t("pickedLbl"))}</small><b>${esc(cn(p.from))} → ${esc(cn(p.to))}</b> · ${esc(nice(p.date))}, ${p.depAt.slice(11, 16)} – ${p.arrAt.slice(11, 16)} · ${esc(p.carrier)} · ${esc(money(p.price, p.currency))}</div><button class="link" type="button" id="trRe">${esc(t("change"))}</button></div>` : ""}
    <div class="route-title"><h2>${esc(ttl)}${esc(cn(r.from))} → ${esc(cn(r.to))}</h2><span>${esc(A.code)} — ${esc(Bc.code)} · ${esc(nice(r.date))} · ${esc(t("paxN", F.pax))} · ${esc(clsName(mode, F.cls))}</span></div>
    <div class="dates" role="group" aria-label="${esc(t("datesAria"))}">${days.map(x => `<button type="button" data-trd="${x.s}" aria-pressed="${x.s === r.date}" class="${x.min !== null && x.min === cheapest ? "cheap" : ""}"><b>${esc(nice(x.s))}</b><small>${x.min === null ? "&nbsp;" : num(x.min)}</small></button>`).join("")}</div>
    <div id="trBest"></div>
    <div class="ttools" id="trTools"></div>
    <div class="list" id="trList"><div class="sk" style="height:130px"></div><div class="sk" style="height:130px"></div></div>
    <p class="note">${esc(note)}</p>`;
  if (scroll) $("#trRes").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
  const re = $("#trRe"); if (re) re.addEventListener("click", () => { T.leg = 0; T.picked = null; T.carrier = ""; renderCal(); trRender(true); });
  $$("[data-trd]").forEach(b => b.addEventListener("click", () => {
    if (T.leg === 0){ F.date = b.dataset.trd; $("#trDate").value = F.date; if (F.ret && F.ret < F.date){ F.ret = F.date; $("#trRet").value = F.ret; } }
    else { F.ret = b.dataset.trd; $("#trRet").value = F.ret; }
    T.carrier = ""; renderCal(); trRender(false);
  }));
  try {
    const offers = (reuse && T.key === key) ? T.results : await trSearchOffers(mode, {from:r.from, to:r.to, date:r.date, pax:F.pax, cls:F.cls});
    if (my !== trSeq || !$("#trList")) return;
    T.results = offers; T.key = key;
    trTools(); trList();
  } catch (e) {
    if (my !== trSeq || !$("#trList")) return;
    T.key = "";
    $("#trList").innerHTML = `<div class="empty">${esc(e.message || t("loadErr"))}<br><button class="btn alt" id="trRetry" type="button">${esc(t("retry"))}</button></div>`;
    $("#trRetry").addEventListener("click", () => trRender(false));
  }
}
const TOD = [["m", 300, 720], ["d", 720, 1080], ["e", 1080, 1440], ["n", 0, 300]];
const todOf = min => (TOD.find(([, a, b]) => min >= a && min < b) || TOD[0])[0];
/* qaytish reysi borish reysi yetib borganidan kamida 2 soat keyin jo'nashi kerak */
function trBase(){ return availOf(T.results, curLeg().date, Q().pax, afterIso()); }
function bestScore(list){
  if (!list.length) return () => 0;
  const pmin = Math.min(...list.map(x => x.price)), dmin = Math.min(...list.map(x => x.dur));
  return x => x.price / pmin + x.dur / dmin * 0.8 + x.stops * 0.25;
}
function trTools(){
  const base = trBase(), carriers = [...new Set(base.map(x => x.carrier))].sort();
  const sc = bestScore(base);
  const pickBy = f => base.slice().sort(f)[0];
  const best = {price:pickBy((a, b) => a.price - b.price || a.dur - b.dur), dur:pickBy((a, b) => a.dur - b.dur || a.price - b.price), best:pickBy((a, b) => sc(a) - sc(b))};
  $("#trBest").innerHTML = base.length ? `<div class="besttabs" role="group" aria-label="${esc(t("sortAria"))}">${[["best","bestBest"],["price","bestCheap"],["dur","bestFast"]].map(([k, l]) =>
    `<button type="button" data-trs="${k}" aria-pressed="${T.sort === k}"><span>${esc(t(l))}</span><b>${esc(money(best[k].price, best[k].currency))}</b><small>${esc(durTxt(best[k].dur))}${T.mode === "avia" ? " · " + esc(best[k].stops ? t("stops", best[k].stops) : t("nonstop")) : ""}</small></button>`).join("")}</div>` : "";
  $("#trTools").innerHTML = `
    <div class="seg" role="group" aria-label="${esc(t("todAria"))}">${TOD.map(([k]) => `<button type="button" data-tod="${k}" aria-pressed="${T.tod.has(k)}">${esc(t("tod_" + k))}</button>`).join("")}</div>
    ${T.mode === "avia" ? `<label class="chk"><input type="checkbox" id="trDirect" ${T.direct ? "checked" : ""}> ${esc(t("direct"))}</label>` : ""}
    <select class="sel" id="trCarrier" aria-label="${esc(t("carrierAria"))}"><option value="">${esc(t("allCarriers", T.mode))}</option>${carriers.map(c => `<option value="${esc(c)}"${c === T.carrier ? " selected" : ""}>${esc(c)}</option>`).join("")}</select>
    <span class="count" id="trCount"></span>`;
  $$("[data-trs]").forEach(b => b.addEventListener("click", () => { T.sort = b.dataset.trs; $$("[data-trs]").forEach(x => x.setAttribute("aria-pressed", x === b)); trList(); }));
  $$("[data-tod]").forEach(b => b.addEventListener("click", () => { const k = b.dataset.tod; T.tod.has(k) ? T.tod.delete(k) : T.tod.add(k); b.setAttribute("aria-pressed", T.tod.has(k)); trList(); }));
  const dc = $("#trDirect"); if (dc) dc.addEventListener("change", e => { T.direct = e.target.checked; trList(); });
  $("#trCarrier").addEventListener("change", e => { T.carrier = e.target.value; trList(); });
}
function amenHtml(it){
  if (T.mode === "avia") return `<span>${ico("bag")}${esc(t("handBag", 8))}</span><span>${esc(t("bagByTariff"))}</span>`;
  return (it.amen || []).map(a => `<span>${ico(a === "wifi" ? "wifi" : a === "cafe" ? "cup" : a === "socket" ? "bolt" : a === "tea" ? "cup" : "snow")}${esc(t("amen_" + a))}</span>`).join("");
}
function detailsHtml(it, r){
  if (T.mode === "avia"){
    const segs = [];
    if (it.stops && it.hub){
      const fly = it.dur - it.layover, l1 = Math.round(fly * .45 / 5) * 5, l2 = fly - l1;
      const a1 = depMinOf(it.depAt) + l1, d2 = a1 + it.layover;
      segs.push([hhmm(depMinOf(it.depAt)), cn(r.from), CITIES[r.from].code], ["fly", durTxt(l1)], [hhmm(a1 % 1440), cn(it.hub), CITIES[it.hub].code], ["wait", t("layover", durTxt(it.layover))], [hhmm(d2 % 1440), cn(it.hub), CITIES[it.hub].code], ["fly", durTxt(l2)], [it.arrAt.slice(11, 16), cn(r.to), CITIES[r.to].code]);
    } else segs.push([it.depAt.slice(11, 16), cn(r.from), CITIES[r.from].code], ["fly", durTxt(it.dur)], [it.arrAt.slice(11, 16), cn(r.to), CITIES[r.to].code]);
    return `<div class="tline">${segs.map(s => s[0] === "fly" ? `<div class="tl-fly">${ico("avia")}${esc(s[1])}</div>` : s[0] === "wait" ? `<div class="tl-wait">${ico("clock")}${esc(s[1])}</div>` : `<div class="tl-pt"><b>${esc(s[0])}</b><span>${esc(s[1])} · ${esc(s[2])}</span></div>`).join("")}</div>
      <div class="dgrid"><div><small>${esc(t("aircraft"))}</small><b>${esc(it.aircraft || "—")}</b></div><div><small>${esc(t("flightNo"))}</small><b>${esc(it.code)}</b></div><div><small>${esc(t("tariffs"))}</small><b>Lite · Standart · Flex</b></div></div>`;
  }
  return `<div class="dgrid">${(it.classes || []).map(c => `<div class="${c.c === T[T.mode].cls ? "cur" : ""}"><small>${esc(clsName("poyezd", c.c))}</small><b>${esc(money(c.price))}</b><span>${esc(c.free ? t("freeN", c.free) : t("soldOut"))}</span></div>`).join("")}</div>`;
}
function trList(){
  const mode = T.mode, F = T[mode];
  const base = trBase();
  let items = base.filter(x => (!T.direct || x.stops === 0) && (!T.carrier || x.carrier === T.carrier) && (!T.tod.size || T.tod.has(todOf(x.depMin))));
  if (T.sort === "best"){ const sc = bestScore(base); items.sort((a, b) => sc(a) - sc(b)); }
  else { const o = T.sort === "price" ? "dur" : T.sort === "dur" ? "price" : "price"; items.sort((a, b) => a[T.sort] - b[T.sort] || a[o] - b[o]); }
  $("#trCount").textContent = t("found", items.length, mode);
  const list = $("#trList");
  if (!items.length){
    list.innerHTML = `<div class="empty">${esc(base.length ? t("noFilter") : t("noResults"))}${base.length ? `<br><button class="btn alt" id="trReset" type="button">${esc(t("clearFilters"))}</button>` : ""}</div>`;
    const rs = $("#trReset"); if (rs) rs.addEventListener("click", () => { T.direct = false; T.carrier = ""; T.tod = new Set(); trTools(); trList(); });
    return;
  }
  const r = curLeg(), A = CITIES[r.from], Bc = CITIES[r.to];
  const icon = mode === "avia" ? `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${ICONS.avia.match(/d="([^"]+)"/)[1]}" transform="rotate(90 12 12)"/></svg>` : ico("poyezd");
  const btn = (F.ret && T.leg === 0) ? t("pickRound") : t("pick");
  const sc = bestScore(base), bestId = base.slice().sort((a, b) => sc(a) - sc(b))[0].id, cheapId = base.slice().sort((a, b) => a.price - b.price)[0].id;
  list.innerHTML = items.map(it => {
    const dd = Math.round((Date.parse(it.arrAt.slice(0, 10)) - Date.parse(it.depAt.slice(0, 10))) / 864e5);
    const stopTxt = mode === "avia" ? (it.stops ? `<span class="st one">${esc(t("stops", it.stops))}${it.hub ? " · " + esc(t("via", cn(it.hub))) : ""}</span>` : `<span class="st">${esc(t("nonstop"))}</span>`) : `<span class="st">${esc(it.code)}</span>`;
    const open = T.open.has(it.id);
    const tag = it.id === bestId ? `<span class="ttag best">${esc(t("bestBest"))}</span>` : it.id === cheapId ? `<span class="ttag cheap">${esc(t("bestCheap"))}</span>` : "";
    return `<article class="ticket${open ? " open" : ""}">
      <div class="main">
        <div class="who"><span class="badge" style="background:${CAT_COLOR[mode]};color:#fff">${esc(it.carrier[0])}</span><b>${esc(it.carrier)}</b>${mode === "avia" ? "· " + esc(it.code) : ""}${tag}</div>
        <div class="tl">
          <div><div class="tm">${it.depAt.slice(11, 16)}</div><div class="pl">${esc(cn(r.from))} · ${esc(A.code)}</div></div>
          <div class="tmid">${esc(durTxt(it.dur))}<div class="ln"><i></i>${icon}<i></i></div>${stopTxt}</div>
          <div class="r"><div class="tm">${it.arrAt.slice(11, 16)}${dd > 0 ? `<sup>${esc(t("dayPlus", dd))}</sup>` : ""}</div><div class="pl">${esc(cn(r.to))} · ${esc(Bc.code)}</div></div>
        </div>
        <div class="amen">${amenHtml(it)}<button type="button" class="more-btn" data-tropen="${esc(it.id)}" aria-expanded="${open}">${esc(t(open ? "lessInfo" : "moreInfo"))}${ico(open ? "up" : "down")}</button></div>
        <div class="tdet" ${open ? "" : "hidden"}>${detailsHtml(it, r)}</div>
      </div>
      <div class="stub">
        <div><div class="tprice">${num(it.price)} <small>${esc(it.currency && it.currency !== "UZS" ? it.currency : t("som"))}</small></div>
        <div class="sub">${esc(F.pax > 1 ? t("totalX", money(it.price * F.pax, it.currency)) : t("perPax"))}</div></div>
        ${it.seats && it.seats <= 4 ? `<div class="left">${esc(t("seatsLeft", it.seats))}</div>` : ""}
        <button class="pick" type="button" data-trpick="${esc(it.id)}">${esc(btn)}</button>
      </div>
    </article>`;
  }).join("");
  $$("[data-trpick]").forEach(b => b.addEventListener("click", () => trPick(T.results.find(x => x.id === b.dataset.trpick))));
  $$("[data-tropen]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.tropen; T.open.has(id) ? T.open.delete(id) : T.open.add(id);
    const art = b.closest(".ticket"), on = T.open.has(id);
    art.classList.toggle("open", on); $(".tdet", art).hidden = !on;
    b.setAttribute("aria-expanded", on); b.innerHTML = esc(t(on ? "lessInfo" : "moreInfo")) + ico(on ? "up" : "down");
  }));
}
function trPick(it){
  const r = curLeg(), F = T[T.mode];
  const leg = Object.assign({}, it, {from:r.from, to:r.to, date:r.date});
  if (F.ret && T.leg === 0){ T.picked = leg; T.leg = 1; T.carrier = ""; T.direct = false; T.tod = new Set(); renderCal(); trRender(true); return; }
  trBook(F.ret && T.picked ? [T.picked, leg] : [leg]);
}

/* ---------- Bron: tarif -> joy -> yo'lovchilar ---------- */
let TB = null;
function trBook(legs){
  const F = T[T.mode];
  TB = {mode:T.mode, legs, pax:Q().pax, cls:Q().cls, tariff:T.mode === "avia" ? "std" : null, seats:legs.map(() => []), wagon:legs.map(() => null)};
  TB.steps = (T.mode === "avia" ? ["tariff"] : []).concat(legs.map((_, i) => "seat" + i), ["pax"]);
  trStep(0);
}
const tbMult = () => TB.tariff ? TARIFFS.find(x => x.k === TB.tariff).m : 1;
const tbTotal = () => TB.legs.reduce((a, l) => a + legPrice(l.price, tbMult()), 0) * TB.pax;
function trSummary(){
  return `<div class="sum">` + TB.legs.map((l, i) => {
    const dd = Math.round((Date.parse(l.arrAt.slice(0, 10)) - Date.parse(l.depAt.slice(0, 10))) / 864e5);
    return `<div><b>${esc(cn(l.from))} → ${esc(cn(l.to))}</b><br>${esc(nice(l.date))}, ${l.depAt.slice(11, 16)} – ${l.arrAt.slice(11, 16)}${dd > 0 ? " (" + esc(t("dayPlus", dd)) + ")" : ""}<br>${esc(l.carrier)} ${esc(l.code)} · ${esc(clsName(TB.mode, TB.cls))}${TB.seats[i].length ? `<br>${esc(t("seatLbl"))}: ${esc(TB.seats[i].map(seatLabel).join(", "))}` : ""}</div>`;
  }).join("<hr>") + (TB.tariff ? `<hr>${esc(t("tariffLbl"))}: <b>${esc(t("tf_" + TB.tariff))}</b>` : "") + `</div>`;
}
const seatLabel = k => k.includes("-") ? t("wagonSeat", k.split("-")[0], k.split("-")[1]) : t("planeSeat", k);
function stepHead(i){ return `<p class="mini" style="margin:0 0 4px">${esc(t("stepOf", i + 1, TB.steps.length))}</p>`; }
function trStep(i){
  TB.i = i;
  const st = TB.steps[i];
  if (st === "tariff") return stepTariff(i);
  if (st.startsWith("seat")) return stepSeats(i, +st.slice(4));
  return stepPax(i);
}
function stepNav(i, nextLabel, nextDisabled){
  return `<div class="selbar"><div class="si" id="selinfo" aria-live="polite"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${i > 0 ? `<button class="btn alt" type="button" id="stBack">${esc(t("back"))}</button>` : ""}<button class="btn" type="button" id="stNext" ${nextDisabled ? "disabled" : ""}>${esc(nextLabel || t("next"))}</button></div></div>`;
}
function bindNav(i){ const b = $("#stBack"); if (b) b.addEventListener("click", () => trStep(i - 1)); }
function stepTariff(i){

  openDlg(`${stepHead(i)}<h3>${esc(t("tariffT"))}</h3>
    <div class="tariffs" role="radiogroup" aria-label="${esc(t("tariffT"))}">${TARIFFS.map(f => `<label class="tcard${TB.tariff === f.k ? " on" : ""}">
      <input type="radio" name="tariff" value="${f.k}" ${TB.tariff === f.k ? "checked" : ""}>
      <b>${esc(t("tf_" + f.k))}</b>
      <span class="tp">${esc(money(TB.legs.reduce((a, l) => a + legPrice(l.price, f.m), 0) * TB.pax))}</span>
      <small>${esc(t("perPaxShort"))}</small>
      <ul><li>${ico("bag")}${esc(t("handBag", f.hand))}</li><li class="${f.bag ? "" : "no"}">${ico("bag")}${esc(f.bag ? t("checkBag", f.bag) : t("noCheckBag"))}</li><li class="${f.k === "flex" ? "" : "no"}">${ico("cal")}${esc(t(f.k === "flex" ? "freeChange" : "noChange"))}</li></ul>
    </label>`).join("")}</div>
    ${stepNav(i)}`, true);
  $$('input[name="tariff"]').forEach(r => r.addEventListener("change", () => { TB.tariff = r.value; $$(".tcard").forEach(c => c.classList.toggle("on", $("input", c).checked)); upd(); }));
  const upd = () => { $("#selinfo").innerHTML = `<b>${esc(t("totalPay"))}: ${esc(money(tbTotal()))}</b><br><span class="mini">${esc(t("paxN", TB.pax))}</span>`; };
  upd(); bindNav(i);
  $("#stNext").addEventListener("click", () => trStep(i + 1));
}
/* --- Joy sxemalari (sxemalar umumiy mantiqda) ---
   Bo'sh joylar = namunaviy bo'sh joylar − sotilgan va boshqalar band qilgan joylar */
async function freeSeats(leg, mode, cls){
  const free = freeSeatsBase(leg, mode, cls);
  try { (await api("GET", "seats", {show:legKey(leg)})).taken.forEach(k => free.delete(k)); } catch (e) {}
  return free;
}
async function stepSeats(i, li){
  const leg = TB.legs[li], need = TB.pax, avia = TB.mode === "avia";
  const wagons = avia ? [] : TR_WAGONS[TB.cls];
  if (!avia && !TB.wagon[li]) TB.wagon[li] = wagons[0];
  const free = await freeSeats(leg, TB.mode, TB.cls);
  TB.seats[li] = TB.seats[li].filter(k => free.has(k));
  const isTaken = k => !free.has(k);
  let map = "", tabs = "";
  if (avia){
    map = `<div class="plane"><div class="nose" aria-hidden="true"></div>${planeLayout(TB.cls).map(row => `<div class="plrow${row.exit ? " exit" : ""}"><span class="rl">${row.r}</span>${row.cols.map(c => {
      if (c === "|") return `<span class="aisle" aria-hidden="true"></span>`;
      const k = row.r + c, tk = isTaken(k), on = TB.seats[li].includes(k);
      return `<button type="button" class="seat" style="--zc:${CAT_COLOR.avia}" data-ts="${k}" aria-pressed="${on}" ${tk ? "disabled" : ""} aria-label="${esc(t("planeSeat", k))}${c === "A" || c === "F" ? ", " + esc(t("window")) : ""}${tk ? ", " + esc(t("taken")) : ""}">${c}</button>`;
    }).join("")}<span class="rl">${row.r}</span></div>`).join("")}</div>`;
  } else {
    const w = TB.wagon[li], L = trainLayout(TB.cls);
    const freeIn = wn => { let n = 0, tot = TB.cls === 0 ? 60 : TB.cls === 1 ? 36 : 18; for (let s = 1; s <= tot; s++) if (!isTaken(wn + "-" + s)) n++; return n; };
    tabs = `<div class="wtabs" role="group" aria-label="${esc(t("wagonsAria"))}">${wagons.map(wn => `<button type="button" data-wagon="${wn}" aria-pressed="${wn === w}"><b>${esc(t("wagonN", wn))}</b><small>${esc(t("freeN", freeIn(wn)))}</small></button>`).join("")}</div>`;
    map = `<div class="wagon"><div class="wend" aria-hidden="true"></div>`;
    const sb = s => { const k = w + "-" + s, tk = isTaken(k), on = TB.seats[li].includes(k); return `<button type="button" class="seat" style="--zc:${CAT_COLOR.poyezd}" data-ts="${k}" aria-pressed="${on}" ${tk ? "disabled" : ""} aria-label="${esc(t("wagonSeat", w, s))}${L.kind === "comp" ? ", " + esc(t(s % 2 ? "lower" : "upper")) : ""}${tk ? ", " + esc(t("taken")) : ""}">${s}</button>`; };
    if (L.kind === "seat") map += `<div class="wseats">${L.rows.map(r => `<div class="wrow">${r.map(s => s === "|" ? `<span class="aisle"></span>` : sb(s)).join("")}</div>`).join("")}</div>`;
    else map += `<div class="comps">${L.comps.map((c, ci) => `<div class="comp"><small>${esc(t("coupe", ci + 1))}</small><div class="berths">${c.map(sb).join("")}</div></div>`).join("")}</div>`;
    map += `<div class="wend" aria-hidden="true"></div></div>`;
  }
  const legName = `${cn(leg.from)} → ${cn(leg.to)}`;
  openDlg(`${stepHead(i)}<h3>${esc(t("seatPickT"))}</h3><p class="mini" style="margin:4px 0 0">${esc(legName)} · ${esc(nice(leg.date))}, ${leg.depAt.slice(11, 16)} · ${esc(leg.carrier)} ${esc(leg.code)}</p>
    ${tabs}<div class="hallwrap">${map}</div>
    <div class="legend"><span><i style="--zc:${CAT_COLOR[TB.mode]}"></i>${esc(t("free"))}</span><span><i class="sel" style="background:${CAT_COLOR[TB.mode]};border-color:${CAT_COLOR[TB.mode]}"></i>${esc(t("chosen"))}</span><span><i class="tk"></i>${esc(t("taken"))}</span>${!avia && TB.cls ? `<span>${esc(t("berthHint"))}</span>` : ""}</div>
    ${avia ? `<button type="button" class="link" id="skipSeats" style="margin-top:10px">${esc(t("skipSeats"))}</button>` : ""}
    ${stepNav(i, null, TB.seats[li].length !== need && !(avia && !TB.seats[li].length))}`, true);
  const upd = () => {
    const n = TB.seats[li].length;
    $("#selinfo").innerHTML = `<b>${esc(t("seatsChosen", n, need))}</b>${n ? `<br><span class="mini">${esc(TB.seats[li].map(seatLabel).join(", "))}</span>` : `<br><span class="mini">${esc(t("needSeats", need))}</span>`}`;
    $("#stNext").disabled = avia ? (n !== 0 && n !== need) : n !== need;
  };
  $$("[data-ts]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.ts, arr = TB.seats[li];
    if (arr.includes(k)) arr.splice(arr.indexOf(k), 1);
    else { if (arr.length >= need){ const old = arr.shift(); const ob = $(`[data-ts="${CSS.escape(old)}"]`); if (ob) ob.setAttribute("aria-pressed", "false"); } arr.push(k); }
    b.setAttribute("aria-pressed", arr.includes(k)); upd();
  }));
  $$("[data-wagon]").forEach(b => b.addEventListener("click", () => { TB.wagon[li] = +b.dataset.wagon; stepSeats(i, li); }));
  const sk = $("#skipSeats"); if (sk) sk.addEventListener("click", () => { TB.seats[li] = []; trStep(i + 1); });
  bindNav(i); upd();
  $("#stNext").addEventListener("click", () => trStep(i + 1));
  const hw = $(".hallwrap"); hw.scrollLeft = avia ? (hw.scrollWidth - hw.clientWidth) / 2 : 0;
  const pw = $('.wtabs [aria-pressed="true"]'); if (pw) pw.scrollIntoView({block:"nearest", inline:"nearest"});
}
function stepPax(i){
  const saved = TB.people || [];
  const pax = Array.from({length:TB.pax}, (_, k) => `
    <fieldset class="pax"><legend>${esc(t("paxLegend", k + 1))}${TB.seats.some(s => s[k]) ? ` · ${esc(TB.seats.map(s => s[k]).filter(Boolean).map(seatLabel).join(" / "))}` : ""}</legend>
      <div class="row2">
        <div class="field"><label for="n${k}">${esc(t("firstName"))}</label><input id="n${k}" autocomplete="given-name" required value="${esc((saved[k] || {}).n || "")}"></div>
        <div class="field"><label for="s${k}">${esc(t("lastName"))}</label><input id="s${k}" autocomplete="family-name" required value="${esc((saved[k] || {}).s || "")}"></div>
      </div>
      <div class="field"><label for="p${k}">${esc(t("passport"))}</label><input id="p${k}" placeholder="AB1234567" maxlength="9" autocapitalize="characters" required value="${esc((saved[k] || {}).p || "")}"></div>
    </fieldset>`).join("");
  openDlg(`${stepHead(i)}<h3>${esc(t("checkout"))}</h3>${trSummary()}
    <form id="tform" novalidate>${pax}
      <div class="total"><span>${esc(t("totalPay"))}</span><b>${esc(money(tbTotal(), TB.legs[0].currency))}</b></div>
      <p class="mini">${esc(t(TB.seats.some(x => x.length) ? "holdNote" : "cartNote"))}</p>
      <div class="row2"><button class="btn alt" id="toCart" type="button">${ico("cart")}${esc(t("addCart"))}</button><button class="btn" id="payBtn" type="submit">${esc(t("buyNow"))}</button></div>
      ${i > 0 ? `<button class="btn alt full" type="button" id="stBack" style="margin-top:8px">${esc(t("back"))}</button>` : ""}
      <p class="fail" id="fail" role="alert"></p>
    </form>`, false);
  const bk = $("#stBack");
  if (bk) bk.addEventListener("click", () => {
    TB.people = Array.from({length:TB.pax}, (_, k) => ({n:$("#n" + k).value.trim(), s:$("#s" + k).value.trim(), p:$("#p" + k).value.trim().toUpperCase()}));
    trStep(i - 1);
  });
  $("#tform").addEventListener("submit", e => { e.preventDefault(); trConfirm(true); });
  $("#toCart").addEventListener("click", () => trConfirm(false));
}
async function trConfirm(goCart){
  const fail = $("#fail"); fail.textContent = "";
  const people = [];
  for (let i = 0; i < TB.pax; i++){
    const n = $("#n" + i).value.trim(), s = $("#s" + i).value.trim(), p = $("#p" + i).value.trim().toUpperCase().replace(/\s/g, "");
    if (!n || !s){ fail.textContent = t("errName", i + 1); $("#n" + i).focus(); return; }
    if (!/^[A-Z]{2}\d{7}$/.test(p)){ fail.textContent = t("errPassport", i + 1); $("#p" + i).focus(); return; }
    people.push({n, s, p});
  }
  TB.people = people;
  const btns = [$("#payBtn"), $("#toCart")]; btns.forEach(b => b.disabled = true);
  const m = tbMult();
  const legs = TB.legs.map((l, i) => ({from:l.from, to:l.to, date:l.date, carrier:l.carrier, code:l.code, depAt:l.depAt, arrAt:l.arrAt, dur:l.dur, stops:l.stops || 0, price:legPrice(l.price, m), currency:l.currency, seats:TB.seats[i].slice()}));
  let holds;
  try {
    holds = await holdSeats(legs.map(l => l.seats.length ? {key:legKey(l), seats:l.seats, leg:{mode:TB.mode, cls:TB.cls, from:l.from, to:l.to, date:l.date, code:l.code, depAt:l.depAt}} : null).filter(Boolean));
  } catch (e) {
    btns.forEach(b => b.disabled = false);
    if (e.code === "seat_taken"){ TB.seats = TB.legs.map(() => []); toast(t("seatGone")); trStep(TB.steps.findIndex(x => x.startsWith("seat"))); return; }
    fail.textContent = errText(e); return;
  }
  Cart.add({type:"travel", mode:TB.mode, cls:TB.cls, tariff:TB.tariff, pax:people, legs, holds, total:tbTotal()});
  closeDlg();
  if (goCart) location.hash = "#/cart";
  else toast(t("addedCart"));
}

/* Server bormi? Bo'lsa — haqiqiy API, bo'lmasa — xuddi shu backend brauzerning o'zida (demo). */
async function detectServer(){
  try {
    if (!/^https?:$/.test(location.protocol) && !CONFIG.API_BASE) return null;
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 4000);
    const res = await fetch(CONFIG.API_BASE + "/api/config", {cache:"no-store", signal:ctl.signal});
    clearTimeout(tm);
    if (!res.ok) return null;
    const c = await res.json();
    return c && c.server === true ? c : null;
  } catch (e) { return null; }
}
(async function init(){
  const lg = store.get("lang", null), nav = (navigator.language || "").slice(0, 2).toLowerCase();
  S.lang = LANGS.includes(lg) ? lg : (nav === "ru" ? "ru" : nav === "en" ? "en" : "uz");
  const th = store.get("theme", null); if (th === "dark" || th === "light") document.documentElement.dataset.theme = th;
  S.city = store.get("city", "") || "";
  if (S.city && !CITIES[S.city]) S.city = "";
  S.cid = store.get("cid", "");
  if (!/^[a-z0-9]{16,40}$/.test(S.cid)){ const a = new Uint8Array(12); crypto.getRandomValues(a); S.cid = Array.from(a, b => b.toString(36).padStart(2, "0")).join("").slice(0, 24); store.set("cid", S.cid); }
  S.token = store.get("token", "") || "";
  const cfg = await detectServer();
  S.server = !!cfg; S.api = !!(cfg && cfg.flights); S.payment = cfg ? cfg.payment : "demo";
  app().innerHTML = `<div class="wrap"><p class="mini" style="padding:60px 0;text-align:center">${esc(t("waiting"))}</p></div>`;
  try { await loadCatalog(); }
  catch (e) { app().innerHTML = `<div class="wrap"><div class="empty" style="margin-top:40px">${esc(t("err_server"))}<br><button class="btn" type="button" onclick="location.reload()">${esc(t("retry"))}</button></div></div>`; return; }
  await loadMe();
  S.favs = new Set((store.get("favs", []) || []).filter(id => EV[id]));
  Cart.load();
  renderChrome();
  bindGlobal();
  bindSearchBox();
  render();
})();
