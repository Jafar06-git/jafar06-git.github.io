  /* ---------- admin ---------- */
  admin(m, a, b, body, ctx){
    const u = this.user(ctx);
    if (!u) return bErr(401, "auth");
    if (u.role !== "admin") return bErr(403, "forbidden");
    if (a === "stats" && m === "GET") return this.stats();
    if (a === "orders" && m === "GET"){
      const q = str(body.q, 40).toUpperCase().replace(/\s/g, "");
      const tix = this.db.all("tickets");
      const list = this.db.all("orders").filter(o => !q || o.code.includes(q) || o.phone.includes(q.replace(/\D/g, "") || "#") || (o.buyer || "").toUpperCase().includes(q))
        .sort((x, y) => y.createdAt.localeCompare(x.createdAt)).slice(0, 200)
        .map(o => Object.assign({}, o, {tickets:tix.filter(t => t.order === o.id).map(t => ({id:t.id, status:t.status, kind:t.kind, title:t.title, from:t.from, to:t.to, date:t.date, price:t.price}))}));
      return bOk(200, {orders:list});
    }
    if (a === "venues" && m === "GET") return bOk(200, {venues:this.db.all("venues")});
    if (a === "events" && !b && m === "GET"){
      const tix = this.db.all("tickets").filter(t => t.kind === "event" && (t.status === "valid" || t.status === "used"));
      return bOk(200, {events:this.db.all("events").map(e => Object.assign({}, e, {sold:tix.filter(t => t.ev === e.id).length, revenue:tix.filter(t => t.ev === e.id).reduce((q, t) => q + t.paid, 0), sessionsList:genSessions(e, this.today()).filter(s => s.date >= this.today()).map(s => ({date:s.date, time:hhmm(s.min), venue:s.venue, hall:s.hall}))}))});
    }
    if (a === "events" && b && m === "PUT") return this.saveEvent(b, body);
    if (a === "events" && b && m === "DELETE"){ const e = this.db.get("events", b); if (!e) return bErr(404, "not_found"); e.active = false; e.rev = (e.rev || 0) + 1; this.db.put("events", b, e); return bOk(200, {ok:true}); }
    if (a === "events" && b && m === "POST" && body.restore){ const e = this.db.get("events", b); if (!e) return bErr(404, "not_found"); e.active = true; e.rev = (e.rev || 0) + 1; this.db.put("events", b, e); return bOk(200, {ok:true}); }
    if (a === "promos" && !b && m === "GET") return bOk(200, {promos:this.db.all("promos")});
    if (a === "promos" && b && m === "PUT") return this.savePromo(b, body);
    if (a === "promos" && b && m === "DELETE"){ this.db.del("promos", b.toUpperCase()); return bOk(200, {ok:true}); }
    if (a === "users" && !b && m === "GET"){
      const os = this.db.all("orders");
      return bOk(200, {users:this.db.all("users").map(x => Object.assign(this.pubUser(x), {createdAt:x.createdAt, orders:os.filter(o => o.user === x.id && o.status === "paid").length}))});
    }
    if (a === "users" && b && m === "PUT"){
      const x = this.db.get("users", b);
      if (!x) return bErr(404, "not_found");
      if (!ROLES.includes(body.role)) return bErr(400, "role");
      if (x.id === u.id && body.role !== "admin") return bErr(400, "self_role");
      x.role = body.role; this.db.put("users", x.id, x); return bOk(200, {user:this.pubUser(x)});
    }
    return bErr(404, "not_found");
  }
  stats(){
    const orders = this.db.all("orders").filter(o => o.status === "paid"), tix = this.db.all("tickets");
    const today = this.today(), days = [];
    for (let i = 13; i >= 0; i--){ const d = isoShift(today, -i); days.push({day:d, revenue:orders.filter(o => o.day === d).reduce((q, o) => q + o.total, 0)}); }
    const sold = tix.filter(t => t.status === "valid" || t.status === "used");
    const byCat = {}; sold.forEach(t => { byCat[t.cat] = (byCat[t.cat] || 0) + t.paid; });
    const byEv = {}; sold.filter(t => t.kind === "event").forEach(t => { byEv[t.ev] = byEv[t.ev] || {ev:t.ev, title:t.title, count:0, revenue:0}; byEv[t.ev].count++; byEv[t.ev].revenue += t.paid; });
    return bOk(200, {
      revenue:orders.reduce((q, o) => q + o.total - (o.refunded || 0), 0), orders:orders.length, tickets:sold.length,
      todayRevenue:orders.filter(o => o.day === today).reduce((q, o) => q + o.total, 0), todayOrders:orders.filter(o => o.day === today).length,
      refunds:tix.filter(t => t.status === "refunded").reduce((q, t) => q + (t.refundAmount || 0), 0),
      scansToday:tix.filter(t => t.status === "used" && t.usedDay === today).length, users:this.db.all("users").length,
      days, byCat, top:Object.values(byEv).sort((x, y) => y.revenue - x.revenue).slice(0, 5)
    });
  }
  saveEvent(id, body){
    const isNew = id === "new", old = isNew ? null : this.db.get("events", id);
    if (!isNew && !old) return bErr(404, "not_found");
    const e = body.event || {};
    const cat = old && old.film ? "kino" : e.cat;
    if (!EVENT_CATS.includes(cat)) return bErr(400, "cat");
    const venues = this.db.all("venues"), vids = venues.map(v => v.id);
    const t = {uz:str(e.t && e.t.uz, 120)}; t.ru = str(e.t && e.t.ru, 120) || t.uz; t.en = str(e.t && e.t.en, 120) || t.uz;
    if (!t.uz && !(old && old.teams)) return bErr(400, "title");
    const price = Math.round(+e.price), dur = Math.round(+e.dur);
    if (!(price >= 1000 && price <= 1e8)) return bErr(400, "price");
    if (!(dur >= 10 && dur <= 720)) return bErr(400, "dur");
    if (!AGES.includes(e.age)) return bErr(400, "age");
    const venue = vids.includes(e.venue) ? e.venue : (old && old.film ? "" : null);
    if (venue === null) return bErr(400, "venue");
    if (!Array.isArray(e.sessions) || e.sessions.length > 200) return bErr(400, "sessions");
    const sessions = [];
    for (const x of e.sessions){
      if (!x || !isDate(x.date) || !isTime(x.time)) return bErr(400, "sessions");
      const v = x.venue && vids.includes(x.venue) ? x.venue : venue;
      if (!v) return bErr(400, "sessions");
      sessions.push({date:x.date, time:x.time, venue:v, hall:Math.max(0, Math.min(20, Math.round(+x.hall || 0)))});
    }
    if (!sessions.length && !(old && old.film)) return bErr(400, "sessions");
    let img = "";
    if (typeof e.img === "string" && e.img){
      if (!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(e.img) || e.img.length > 700000) return bErr(400, "img");
      img = e.img;
    }
    const hue = Array.isArray(e.hue) && e.hue.length === 2 ? e.hue.map(h => Math.max(0, Math.min(360, Math.round(+h || 0)))) : (old && old.hue) || [260, 200];
    const nid = isNew ? "x" + this.rand(6).toLowerCase() : id;
    const ev = Object.assign({}, old || {}, {id:nid, cat, venue:venue || (old && old.venue) || "", t, genre:str(e.genre, 30) || (old && old.genre) || "drama", age:e.age, dur, price,
      hue, img, feat:!!e.feat, pop:!!e.pop, active:true, rev:((old && old.rev) || 0) + 1, updatedAt:new Date().toISOString()});
    if (sessions.length){ ev.sessions = sessions; delete ev.s; delete ev.d; }
    if (old && old.film && !sessions.length){ delete ev.sessions; }
    if (e.types === null || e.types === "") delete ev.types; else if (e.types !== undefined){ if (!TYPE_SETS[e.types]) return bErr(400, "types"); ev.types = e.types; }
    this.db.put("events", nid, ev);
    return bOk(200, {event:ev});
  }
  savePromo(code, body){
    code = String(code).toUpperCase();
    if (!/^[A-Z0-9]{3,20}$/.test(code)) return bErr(400, "promo_code");
    const p = body.promo || {}, old = this.db.get("promos", code);
    const type = p.type === "fix" ? "fix" : "pct", value = Math.round(+p.value);
    if (type === "pct" ? !(value >= 1 && value <= 90) : !(value >= 1000 && value <= 1e7)) return bErr(400, "promo_value");
    const cats = Array.isArray(p.cats) ? p.cats.filter(c => CATS.includes(c)) : [];

      cats, perUser:!!p.perUser, active:p.active !== false, uses:old ? old.uses || 0 : 0};
    this.db.put("promos", code, doc);
    return bOk(200, {promo:doc});

/* =====================================================================
   QR KOD (tashqi kutubxonasiz): bayt rejimi, xatoni tuzatish darajasi M,
   1–9 versiyalar (178 baytgacha).
   ===================================================================== */
const QR = (() => {
  const EXP = new Array(512), LOG = new Array(256);
  let x = 1;
  for (let i = 0; i < 255; i++){ EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11D; }
  for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  const mul = (a, b) => (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]];
  // [jami kodso'zlar, blok soni, har blokdagi EC kodso'zlar]
  const TAB = [null, [26,1,10],[44,1,16],[70,1,26],[100,2,18],[134,2,24],[172,4,16],[196,4,18],[242,4,22],[292,5,22]];
  const ALIGN = [null, [], [6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46]];

  function rsRemainder(data, n){
    let g = [1];
    for (let i = 0; i < n; i++){
      const ng = new Array(g.length + 1).fill(0);
      for (let j = 0; j < g.length; j++){ ng[j] ^= g[j]; ng[j + 1] ^= mul(g[j], EXP[i]); }
      g = ng;
    }
    const res = new Array(n).fill(0);
    for (const b of data){
      const f = b ^ res.shift();
      res.push(0);
      for (let i = 0; i < n; i++) res[i] ^= mul(g[i + 1], f);
    }
    return res;
  }
  function utf8(str){
    const out = [];
    for (const ch of str){
      let c = ch.codePointAt(0);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xC0 | c >> 6, 0x80 | c & 63);
      else if (c < 0x10000) out.push(0xE0 | c >> 12, 0x80 | c >> 6 & 63, 0x80 | c & 63);
      else out.push(0xF0 | c >> 18, 0x80 | c >> 12 & 63, 0x80 | c >> 6 & 63, 0x80 | c & 63);
    }
    return out;
  }

  function encode(text){
    const bytes = utf8(String(text));
    let ver = 0;
    for (let v = 1; v <= 9; v++){
      const [tot, nb, ec] = TAB[v];
      if (4 + 8 + bytes.length * 8 <= (tot - nb * ec) * 8){ ver = v; break; }
    }
    if (!ver) throw new Error("QR: matn juda uzun");
    const [total, nBlocks, ecLen] = TAB[ver];
    const dataCap = total - nBlocks * ecLen;
    // bitlar
    const bits = [];
    const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, 8); bytes.forEach(b => put(b, 8));
    put(0, Math.min(4, dataCap * 8 - bits.length));
    while (bits.length % 8) bits.push(0);
    const data = [];
    for (let i = 0; i < bits.length; i += 8){ let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; data.push(b); }
    for (let p = 0xEC; data.length < dataCap; p ^= 0xEC ^ 0x11) data.push(p);
    // bloklar va almashtirib joylash
    const numShort = nBlocks - total % nBlocks, shortLen = Math.floor(total / nBlocks);
    const blocks = [];
    for (let i = 0, k = 0; i < nBlocks; i++){
      const dat = data.slice(k, k + shortLen - ecLen + (i < numShort ? 0 : 1));
      k += dat.length;
      const ecc = rsRemainder(dat, ecLen);
      if (i < numShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const cw = [];
    for (let i = 0; i < blocks[0].length; i++)
      for (let j = 0; j < blocks.length; j++)
        if (i !== shortLen - ecLen || j >= numShort) cw.push(blocks[j][i]);

    const size = ver * 4 + 17;
    const mod = Array.from({length:size}, () => new Array(size).fill(false));
    const fn = Array.from({length:size}, () => new Array(size).fill(false));
    const set = (x, y, d) => { mod[y][x] = d; fn[y][x] = true; };
    for (let i = 0; i < size; i++){ set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++){
        const xx = cx + dx, yy = cy + dy;
        if (xx < 0 || yy < 0 || xx >= size || yy >= size) continue;
        const d = Math.max(Math.abs(dx), Math.abs(dy));
        set(xx, yy, d !== 2 && d !== 4);
      }
    };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    const al = ALIGN[ver], last = al.length - 1;
    for (let i = 0; i < al.length; i++) for (let j = 0; j < al.length; j++){
      if ((i === 0 && j === 0) || (i === 0 && j === last) || (i === last && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
        set(al[i] + dx, al[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    const drawFormat = mask => {
      const d = (0 << 3) | mask;  // M darajasi = 00
      let r = d;
      for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = ((d << 10) | r) ^ 0x5412;
      const g = i => ((b >>> i) & 1) !== 0;
      for (let i = 0; i <= 5; i++) set(8, i, g(i));
      set(8, 7, g(6)); set(8, 8, g(7)); set(7, 8, g(8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, g(i));
      for (let i = 0; i < 8; i++) set(size - 1 - i, 8, g(i));
      for (let i = 8; i < 15; i++) set(8, size - 15 + i, g(i));
      set(8, size - 8, true);
    };
    drawFormat(0);
    if (ver >= 7){
      let r = ver;
      for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25);
      const b = (ver << 12) | r;
      for (let i = 0; i < 18; i++){
        const bit = ((b >>> i) & 1) !== 0, a = size - 11 + i % 3, c = Math.floor(i / 3);
        set(a, c, bit); set(c, a, bit);
      }
    }
    // ma'lumotni joylash
    let bi = 0;
    for (let right = size - 1; right >= 1; right -= 2){
      if (right === 6) right = 5;
      for (let v = 0; v < size; v++) for (let j = 0; j < 2; j++){
        const xx = right - j, up = ((right + 1) & 2) === 0, yy = up ? size - 1 - v : v;
        if (!fn[yy][xx] && bi < cw.length * 8){ mod[yy][xx] = ((cw[bi >>> 3] >>> (7 - (bi & 7))) & 1) !== 0; bi++; }
      }
    }
    const maskFn = [
      (x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,
      (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0
    ];
    const applyMask = m => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && maskFn[m](x, y)) mod[y][x] = !mod[y][x]; };
    const penalty = () => {
      let p = 0, dark = 0;
      const line = get => {
        let run = 1;
        for (let i = 1; i <= size; i++){
          if (i < size && get(i) === get(i - 1)) run++;
          else { if (run >= 5) p += 3 + run - 5; run = 1; }
        }
        const pat = [1,0,1,1,1,0,1];
        for (let i = 0; i + 7 <= size; i++){
          let ok = true;
          for (let k = 0; k < 7; k++) if ((get(i + k) ? 1 : 0) !== pat[k]){ ok = false; break; }
          if (!ok) continue;
          const lightRun = (s, e) => { for (let k = s; k < e; k++) if (k >= 0 && k < size && get(k)) return false; return true; };
          if (lightRun(i - 4, i) || lightRun(i + 7, i + 11)) p += 40;
        }
      };
      for (let y = 0; y < size; y++) line(i => mod[y][i]);
      for (let x = 0; x < size; x++) line(i => mod[i][x]);
      for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++){
        const c = mod[y][x];
        if (c === mod[y][x + 1] && c === mod[y + 1][x] && c === mod[y + 1][x + 1]) p += 3;
      }
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (mod[y][x]) dark++;
      p += Math.floor(Math.abs(dark * 100 / (size * size) - 50) / 5) * 10;
      return p;
    };
    let best = 0, bestP = Infinity;
    for (let m = 0; m < 8; m++){
      applyMask(m); drawFormat(m);
      const pe = penalty();
      if (pe < bestP){ bestP = pe; best = m; }
      applyMask(m);
    }
    applyMask(best); drawFormat(best);
    return mod;
  }

  function svg(text, color){
    const m = encode(text), n = m.length, q = 4, s = n + q * 2;
    let d = "";
    for (let y = 0; y < n; y++){
      let x = 0;
      while (x < n){
        if (!m[y][x]){ x++; continue; }
        let w = 1; while (x + w < n && m[y][x + w]) w++;
        d += `M${x + q} ${y + q}h${w}v1h-${w}z`;
        x += w;
      }
    }
    return `<svg viewBox="0 0 ${s} ${s}" class="qr" role="img" aria-label="QR" shape-rendering="crispEdges"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="${color || "#111"}"/></svg>`;
  }
  return { encode, svg };
})();

/* =====================================================================

const MiniPDF = (() => {
  const W_REG = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
  const W_BOLD = [278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];

  class Doc {

    addPage(){ this.cur = []; this.pages.push(this.cur); this.font = "F1"; this.size = 10; return this; }
    op(s){ this.cur.push(s); return this; }
    fill(c){ return this.op(`${f(c[0]/255)} ${f(c[1]/255)} ${f(c[2]/255)} rg`); }
    stroke(c){ return this.op(`${f(c[0]/255)} ${f(c[1]/255)} ${f(c[2]/255)} RG`); }
    lineWidth(mm){ return this.op(`${f(mm * K)} w`); }
    dash(on, off){ return this.op(on ? `[${f(on * K)} ${f(off * K)}] 0 d` : "[] 0 d"); }
    rect(x, y, w, h, mode){ return this.op(`${f(x * K)} ${f((this.h - y - h) * K)} ${f(w * K)} ${f(h * K)} re ${mode || "f"}`); }

        `${X(x + r)} ${Y(y)} m ${X(x + w - r)} ${Y(y)} l ${X(x + w - r + k)} ${Y(y)} ${X(x + w)} ${Y(y + r - k)} ${X(x + w)} ${Y(y + r)} c ` +
        `${X(x + w)} ${Y(y + h - r)} l ${X(x + w)} ${Y(y + h - r + k)} ${X(x + w - r + k)} ${Y(y + h)} ${X(x + w - r)} ${Y(y + h)} c ` +
        `${X(x + r)} ${Y(y + h)} l ${X(x + r - k)} ${Y(y + h)} ${X(x)} ${Y(y + h - r + k)} ${X(x)} ${Y(y + h - r)} c ` +
        `${X(x)} ${Y(y + r)} l ${X(x)} ${Y(y + r - k)} ${X(x + r - k)} ${Y(y)} ${X(x + r)} ${Y(y)} c h ${mode || "f"}`);
    }

      const n = this.imgs.length; this.imgs.push({bytes, w:wpx, h:hpx});
      return this.op(`q ${f(w * K)} 0 0 ${f(h * K)} ${f(x * K)} ${f((this.h - y - h) * K)} cm /Im${n} Do Q`);
    }
    circle(cx, cy, r, mode){ return this.rrect(cx - r, cy - r, r * 2, r * 2, r, mode); }
    line(x1, y1, x2, y2){ return this.op(`${f(x1 * K)} ${f((this.h - y1) * K)} m ${f(x2 * K)} ${f((this.h - y2) * K)} l S`); }

      const m = QR.encode(text), n = m.length, cell = sizeMM / (n + 2);

      this.fill([17,17,17]);
      for (let r = 0; r < n; r++){
        let c = 0;
        while (c < n){
          if (!m[r][c]){ c++; continue; }
          let w = 1; while (c + w < n && m[r][c + w]) w++;
          this.rect(x + (c + 1) * cell, y + (r + 1) * cell, w * cell + 0.02, cell + 0.02);

      objs[3] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";

      const xo = nI ? ` /XObject << ${this.imgs.map((_, i) => `/Im${i} ${5 + i} 0 R`).join(" ")} >>` : "";
      this.pages.forEach((ops, i) => {
        const content = ops.join("\n"), pn = 5 + nI + i * 2;

      for (let i = 1; i < objs.length; i++) tail += String(offs[i]).padStart(10, "0") + " 00000 n \n";

      push(tail);

      return out;
    }

const LocalStore = (() => {
  const P = "gochipta:db:", mem = {};
  const load = c => { if (mem[c]) return mem[c]; let v = {}; try { v = JSON.parse(localStorage.getItem(P + c) || "{}") || {}; } catch (e) {} return (mem[c] = v); };
  const save = c => { try { localStorage.setItem(P + c, JSON.stringify(mem[c])); } catch (e) { console.warn("localStorage to'ldi:", e); } };
  const cp = v => v == null ? null : JSON.parse(JSON.stringify(v));
  return {
    kind:"local",
    get:(c, i) => cp(load(c)[i]),
    put:(c, i, v) => { load(c)[i] = cp(v); save(c); },
    del:(c, i) => { delete load(c)[i]; save(c); },
    all:c => Object.values(load(c)).map(cp),
    tx:fn => fn()
  };
})();

class ApiError extends Error { constructor(status, body){ super((body && body.error) || "error"); this.status = status; this.body = body || {}; this.code = (body && body.error) || "error"; } }
async function api(method, path, body){
  let out;
  if (S.server){
    const isGet = method === "GET" || method === "DELETE";
    const q = isGet && body ? "?" + new URLSearchParams(body) : "";
    const res = await fetch(CONFIG.API_BASE + "/api/" + path + q, {method, cache:"no-store",
      headers:Object.assign({"X-Client-Id":S.cid}, isGet ? {} : {"Content-Type":"application/json"}, S.token ? {Authorization:"Bearer " + S.token} : {}),
      body:isGet ? undefined : JSON.stringify(body || {})});
    out = {status:res.status, body:await res.json().catch(() => ({error:"server"}))};
  } else {
    await sleep(120);
    out = await localBackend().handle(method, path, body || {}, {token:S.token, cid:S.cid});
  }
  if (out.status === 401 && S.token && path !== "auth/verify"){ setAuth(null, null); }
  if (out.status >= 400) throw new ApiError(out.status, out.body);
  return out.body;
}

const Cart = {
  items:[],
  load(){ this.items = (store.get("cart", []) || []).filter(x => x && x.id && (x.type === "event" ? EV[x.ev] : x.type === "travel")); },
  save(){ store.set("cart", this.items); updCartCount(); },
  add(it){ it.id = it.id || Math.random().toString(36).slice(2, 10); this.items.push(it); this.save(); return it; },
  remove(id){
    const it = this.items.find(x => x.id === id);

const filt = c => S.filters[c] || (S.filters[c] = {when:"all", date:"", sort:"date"});
function whenPred(F){
  const d0 = TODAY.getDay();
  if (F.when === "today") return d => d === TODAY_ISO;
  if (F.when === "tomorrow") return d => d === isoAdd(1);
  if (F.when === "week") return d => d <= isoAdd(6);
  if (F.when === "weekend"){
    const toSat = d0 === 0 ? -1 : 6 - d0;
    const set = new Set([isoAdd(Math.max(0, toSat)), isoAdd(toSat + 1)].filter(x => x >= TODAY_ISO));
    return d => set.has(d);
  }
  if (F.when === "date" && F.date) return d => d === F.date;
  return () => true;
}

function filtered(c){
  const F = filt(c), p = whenPred(F);
  let rows = visible(c).map(ev => { const list = citySess(ev).filter(s => p(s.date)); return {ev, s:list[0], list}; }).filter(x => x.s);
  if (F.sort === "cheap") rows.sort((a, b) => sessFrom(a.ev, a.s) - sessFrom(b.ev, b.s));

  else rows.sort((a, b) => (a.s.date + pad(a.s.min)).localeCompare(b.s.date + pad(b.s.min)));
  return rows;
}

    slides.forEach((s, k) => { s.classList.toggle("on", k === i); s.setAttribute("aria-hidden", k !== i); $$("a,button", s).forEach(a => a.tabIndex = k === i ? 0 : -1); });
    dots.forEach((d, k) => { d.setAttribute("aria-current", k === i); if (k === i){ d.style.animation = "none"; void d.offsetWidth; d.style.animation = ""; } });
    schedule();
  };
  const schedule = () => { clearTimeout(heroTimer); if (!reduce && !paused && slides.length > 1) heroTimer = setTimeout(() => show(i + 1), 6000); };
  const pause = p => { paused = p; hero.classList.toggle("paused", p); if (p) clearTimeout(heroTimer); else schedule(); };
  if (reduce) hero.classList.add("paused");
  dots.forEach(d => d.addEventListener("click", () => show(+d.dataset.slide)));
  $("#hPrev").addEventListener("click", () => show(i - 1));
  $("#hNext").addEventListener("click", () => show(i + 1));
  hero.addEventListener("mouseenter", () => pause(true));
  hero.addEventListener("mouseleave", () => pause(false));
  hero.addEventListener("focusin", () => pause(true));
  hero.addEventListener("focusout", e => { if (!hero.contains(e.relatedTarget)) pause(false); });
  let x0 = null;
  hero.addEventListener("pointerdown", e => { x0 = e.clientX; });
  hero.addEventListener("pointerup", e => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 50) show(i + (dx < 0 ? 1 : -1)); });
  show(0);
}

const norm = s => String(s).toLowerCase().replace(/[ʻʼ’‘`']/g, "'").replace(/ё/g, "е");
function searchEvents(q){
  q = norm(q.trim()); if (!q) return [];
  const hit = txt => { const n = norm(txt); return n.startsWith(q) || n.split(/[\s\-—:«»"'.,()]+/).some(w => w.startsWith(q)) || (q.length >= 4 && n.includes(q)); };
  return EVENTS.filter(ev => upcoming(ev).length && (
    LANGS.some(lg => hit(title(ev, lg))) ||
    LANGS.some(lg => hit(gn(ev.genre, lg))) ||
    LANGS.some(lg => hit(tl(lg, "cat_" + ev.cat))) ||
    sessionsOf(ev).some(s => LANGS.some(lg => hit(VENUES[s.venue].n[lg]) || hit(cn(VENUES[s.venue].city, lg))))
  ));
}

function bindSearchBox(){
  const inp = $("#q"), drop = $("#qdrop");
  let items = [], idx = -1;
  const close = () => { drop.hidden = true; idx = -1; inp.setAttribute("aria-expanded", "false"); };
  const draw = () => {
    const v = inp.value.trim();
    if (!v){ close(); return; }
    const res = searchEvents(v).slice(0, 6);
    items = res.map(ev => evHref(ev));
    drop.innerHTML = res.length ? res.map((ev, i) => { const s = upcoming(ev)[0]; return `<a href="${evHref(ev)}" role="option" id="qo${i}" class="${i === idx ? "on" : ""}"><span class="qth">${poster(ev, 120, 180)}</span><span><span class="qt">${esc(title(ev))}</span><small>${esc(catName(ev.cat))} · ${esc(nice(s.date))}</small></span></a>`; }).join("")
      : `<div class="qnone">${esc(t("searchNone"))}</div>`;
    drop.hidden = false; inp.setAttribute("aria-expanded", "true");
  };
  inp.addEventListener("input", () => { idx = -1; draw(); });
  inp.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      if (!items.length) return; e.preventDefault();
      idx = (idx + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; draw();
      inp.setAttribute("aria-activedescendant", "qo" + idx);
    } else if (e.key === "Enter"){
      e.preventDefault();
      if (idx >= 0) location.hash = items[idx]; else if (inp.value.trim()) location.hash = "#/search/" + encodeURIComponent(inp.value.trim());
      close(); inp.blur(); $("#qbox").classList.remove("open");
    } else if (e.key === "Escape"){ close(); $("#qbox").classList.remove("open"); }
  });
  inp.addEventListener("blur", () => setTimeout(close, 180));
  drop.addEventListener("click", () => { close(); $("#qbox").classList.remove("open"); });
  $("#qbtn").addEventListener("click", () => { $("#qbox").classList.add("open"); inp.focus(); });
}

  let html, bind = () => {}, cat = "home";
  if (!parts.length){ html = viewHome(); bind = bindHome; }
  else if (parts[0] === "c" && CATS.includes(parts[1])){ cat = parts[1]; html = viewCat(cat); bind = () => cat === "avia" || cat === "poyezd" ? bindTravel(cat) : bindCat(cat); }
  else if (parts[0] === "e" && EV[parts[1]]){ cat = EV[parts[1]].cat; html = viewEvent(parts[1]); bind = () => bindEvent(parts[1]); }
  else if (parts[0] === "search"){ html = viewSearch(parts.slice(1).join("/")); }
  else if (parts[0] === "tickets" || parts[0] === "account"){ cat = "account"; if (parts[1] === "fav" || parts[1] === "tix" || parts[1] === "me") S.acct = parts[1]; html = viewAccount(); bind = bindAccount; }
  else if (parts[0] === "cart"){ cat = "cart"; html = viewCart(); bind = bindCart; }
  else if (parts[0] === "admin"){ cat = "admin"; html = viewAdmin(); bind = bindAdmin; }
  else if (parts[0] === "scan"){ cat = "admin"; html = viewScan(); bind = bindScan; }
  else if (parts[0] === "legal"){ cat = "legal"; html = viewLegal(parts[1]); }
  else html = notFound();
  document.body.dataset.cat = cat;
  if (!(parts[0] === "e")){ $("#mbar").hidden = true; document.body.classList.remove("has-mbar"); }
  app().innerHTML = html;
  bind();
  $$("#catnav a").forEach(a => { if ((parts[0] === "c" && a.dataset.nav === parts[1]) || (parts[0] === "e" && a.dataset.nav === cat)) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const act = $('#catnav a[aria-current="page"]'); if (act) act.scrollIntoView({block:"nearest", inline:"center"});
  const pageT = {cart:t("cartT"), account:t("account"), admin:t(parts[0] === "scan" ? "scanT" : "adminT"), legal:parts[1] && LEGAL[parts[1]] ? (LEGAL[parts[1]][S.lang] || LEGAL[parts[1]].uz).t : ""}[cat];
  document.title = parts[0] === "e" && EV[parts[1]] ? `${title(EV[parts[1]])} — ${CONFIG.BRAND}` : parts[0] === "c" ? `${catName(cat)} — ${CONFIG.BRAND}` : pageT ? `${pageT} — ${CONFIG.BRAND}` : t("docTitle");
  if (!keepScroll && h !== lastPath){ window.scrollTo({top:0, left:0, behavior:"instant"}); if (lastPath !== null) app().focus({preventScroll:true}); }
  lastPath = h;
}

/* Umumiy hodisalar (yurakcha, chipta olish, kalendar, PDF) */
function bindGlobal(){
  document.addEventListener("click", e => {
    const fav = e.target.closest("[data-fav]");
    if (fav){
      e.preventDefault(); e.stopPropagation();
      const id = fav.dataset.fav;
      if (S.favs.has(id)){ S.favs.delete(id); toast(t("favRemoved")); } else { S.favs.add(id); toast(t("favAdded")); }
      store.set("favs", [...S.favs]);
      $$(`[data-fav="${id}"]`).forEach(b => b.setAttribute("aria-pressed", S.favs.has(id)));
      return;
    }
    const same = e.target.closest('a[href^="#"]');
    if (same && !e.defaultPrevented && (same.getAttribute("href") === location.hash || (same.getAttribute("href") === "#/" && (location.hash === "" || location.hash === "#")))){
      e.preventDefault(); window.scrollTo({top:0, behavior:matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); return;
    }
    const buy = e.target.closest("[data-buy]");
    if (buy){ const s = sessById(buy.dataset.buy); if (s) openBuy(EV[s.ev], s); return; }
    const ics = e.target.closest("[data-ics]");
    if (ics){ const s = sessById(ics.dataset.ics); if (s) downloadIcs(EV[s.ev], s); return; }
    const reset = e.target.closest("[data-reset]");
    if (reset){ S.filters[reset.dataset.reset] = null; render(true); return; }
    const rt = e.target.closest("[data-route]");
    if (rt){ const [m, a, b] = rt.dataset.route.split("|"); trPreset(m, a, b); return; }
  });
  window.addEventListener("hashchange", () => { S.navCount = (S.navCount || 0) + 1; closeDlg(); go(); });
  $("#theme2").addEventListener("click", toggleTheme);
  $("#toTop").addEventListener("click", () => { window.scrollTo({top:0, behavior:matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); });
  $("#city").addEventListener("change", e => { S.city = e.target.value; store.set("city", S.city); render(true); });
  $$(".langs button").forEach(b => b.addEventListener("click", () => { S.lang = b.dataset.lang; store.set("lang", S.lang); renderChrome(); render(true); if ($("#dlg").open) closeDlg(); }));
  $("#theme").addEventListener("click", toggleTheme);
  $("#langBtn").addEventListener("click", () => { S.lang = LANGS[(LANGS.indexOf(S.lang) + 1) % LANGS.length]; store.set("lang", S.lang); renderChrome(); render(true); if ($("#dlg").open) closeDlg(); });
  $("#userBtn").addEventListener("click", () => { if (S.user) location.hash = "#/account"; else openLogin(() => { location.hash = "#/account"; render(true); }); });
  $("#dlgClose").addEventListener("click", closeDlg);
  $("#dlg").addEventListener("click", e => { if (e.target === $("#dlg")) closeDlg(); });
  $("#dlg").addEventListener("close", () => { $("#dlg").classList.remove("wide"); });
}

function bindCart(){
  if (!Cart.items.length) return;
  $$("[data-crm]").forEach(b => b.addEventListener("click", () => { Cart.remove(b.dataset.crm); render(true); }));
  $("#promoBtn").addEventListener("click", () => { CART.promo = $("#promo").value.trim().toUpperCase(); requote(true); });
  $("#promo").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); $("#promoBtn").click(); } });
  $("#cform").addEventListener("submit", e => { e.preventDefault(); placeOrder(); });
  tickHolds();
  requote(false);

/* Narxni server hisoblaydi (promokod bilan) */
async function requote(showPromo){
  const my = ++CART.seq, box = $("#qsum"); if (!box) return;
  box.innerHTML = `<p class="mini">${esc(t("waiting"))}</p>`;
  try {
    const q = await api("POST", "quote", {items:Cart.items.map(x => Cart.payload(x)), promo:CART.promo});
    if (my !== CART.seq || !$("#qsum")) return;
    CART.quote = q; CART.qerr = "";
    const pm = $("#promoMsg");
    if (q.promo && q.promo.error){ pm.className = "mini bad"; pm.textContent = errText({code:q.promo.error, body:{min:q.promo.min}}); }
    else if (q.promo){ pm.className = "mini good"; pm.textContent = t("promoOk", q.promo.code, money(q.discount)); }
    else pm.textContent = "";
    if (showPromo && !CART.promo) pm.textContent = "";
    box.innerHTML = `<div class="trow"><span>${esc(t("subtotal"))}</span><span>${esc(money(q.subtotal))}</span></div>
      ${q.discount ? `<div class="trow good"><span>${esc(t("discount"))}</span><span>−${esc(money(q.discount))}</span></div>` : ""}
      <div class="total"><span>${esc(t("totalPay"))}</span><b>${esc(money(q.total))}</b></div>`;
  } catch (e) {
    if (my !== CART.seq || !$("#qsum")) return;
    CART.quote = null; CART.qerr = e.code;
    box.innerHTML = `<p class="fail">${esc(errText(e))}</p>`;
  }
}
/* Band qilish taymerlari */
function tickHolds(){
  $$("[data-exp]").forEach(el => {
    const left = +el.dataset.exp - Date.now(), it = Cart.items.find(x => x.id === el.dataset.hold);
    if (left > 0){
      el.className = "hold" + (left < 120e3 ? " warn" : "");
      el.innerHTML = `${ico("clock")}${esc(t("holdLeft", timerTxt(left)))}${left < 180e3 ? ` <button type="button" class="link" data-renew="${esc(el.dataset.hold)}">${esc(t("renew"))}</button>` : ""}`;
    } else {
      el.className = "hold bad";
      el.innerHTML = `${ico("clock")}${esc(t("holdExpired"))} <button type="button" class="link" data-renew="${esc(el.dataset.hold)}">${esc(t("renew"))}</button>`;
    }
    if (!it) el.remove();
  });
}
setInterval(tickHolds, 1000);
async function renewItem(id){
  const it = Cart.items.find(x => x.id === id); if (!it) return;
  try {
    for (const h of it.holds || []){ const r = await api("POST", "holds/" + h.id + "/renew"); h.exp = r.exp; }
    Cart.save(); toast(t("renewed"));
  } catch (e) {
    /* muddati o'tib ketgan bo'lsa — qaytadan band qilib ko'ramiz */
    try {
      const list = it.type === "event" ? [{key:it.show, seats:it.seats.map(z => z.row + "-" + z.seat)}]
        : it.legs.filter(l => l.seats.length).map(l => ({key:legKey(l), seats:l.seats, leg:{mode:it.mode, cls:it.cls, from:l.from, to:l.to, date:l.date, code:l.code, depAt:l.depAt}}));
      it.holds = await holdSeats(list); Cart.save(); toast(t("renewed"));
    } catch (e2) { toast(t("seatGone")); Cart.remove(id); }
  }
  if (location.hash.startsWith("#/cart")) render(true);
}

async function placeOrder(){
  const fail = $("#fail"); fail.textContent = "";
  const buyer = $("#buyer").value.trim(), email = $("#mail").value.trim();
  if (buyer.length < 2){ fail.textContent = t("errBuyer"); $("#buyer").focus(); return; }
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ fail.textContent = t("errEmail"); $("#mail").focus(); return; }
  if (!$("#agree").checked){ fail.textContent = t("err_agree"); $("#agree").focus(); return; }
  if (Cart.items.some(x => Cart.expired(x))){ fail.textContent = t("holdExpiredAll"); return; }
  const pm = $('input[name="pm"]:checked').value;
  store.set("buyer", {name:buyer, email, pm});
  if (!S.user){ openLogin(() => { render(true); setTimeout(() => { const a = $("#agree"); if (a) a.checked = true; }, 0); }); return; }
  const btn = $("#payBtn"); btn.disabled = true; btn.textContent = t("waiting");
  try {
    const r = await api("POST", "orders", {items:Cart.items.map(x => Cart.payload(x)), promo:CART.promo, buyer, email, payment:pm, agree:true});
    Cart.items = []; Cart.save(); CART.promo = ""; S.orders = null;
    if (r.order.payUrl){ toast(t("toPayment")); setTimeout(() => { location.href = r.order.payUrl; }, 600); return; }
    S.pendingDone = [r.order, r.tickets];
    if (location.hash === "#/account") render(true); else location.hash = "#/account";
  } catch (e) {
    btn.disabled = false; btn.textContent = t(S.payment === "demo" ? "payDemo" : "payApi");
    fail.textContent = errText(e);
    if (e.code === "seat_taken" || e.code === "show_gone" || e.code === "offer_gone") requote(false);
  }
}
function showOrderDone(order, tickets){
  const paid = order.status === "paid";
  const first = tickets.find(x => x.status === "valid");
  openDlg(`<h3><span class="okmark" aria-hidden="true">✓</span>${esc(t(paid ? (S.payment === "demo" ? "done" : "doneApi") : "donePending"))}</h3>
    <div class="okc">${first ? QR.svg(first.qr) : ""}<div><p class="mini" style="margin:0">${esc(t("codeLbl"))}</p><div class="code">${esc(order.code)}</div>
      <p class="mini" style="margin:0">${esc(t("ticketsN", tickets.length))} · ${esc(money(order.total))}${order.discount ? ` (${esc(t("discount"))}: −${esc(money(order.discount))})` : ""}</p></div></div>
    <p class="mini">${esc(t(S.payment === "demo" ? "noteDemoDone" : "noteApiDone"))}</p>
    <div class="stack"><div class="row">
      <button class="btn" type="button" id="donePdf">${ico("qr")}${esc(t("pdfAll"))}</button>
      <a class="btn alt" href="#/account" id="doneAcc">${esc(t("toTickets"))}</a></div></div>`, false);

/* =====================================================================
   XARID: joy / sektor / chipta turi -> savat (joylar 10 daqiqaga band qilinadi)
   ===================================================================== */
let B = null;   // joriy xarid: {ev, s, seats:Map, items:Map}
function openDlg(html, wide){
  const d = $("#dlg");
  d.classList.toggle("wide", !!wide);
  $("#dlgClose").setAttribute("aria-label", t("closeAria"));
  $("#dlgbody").innerHTML = html;
  if (!d.open) d.showModal();
  d.scrollTop = 0;
}
function closeDlg(){ const d = $("#dlg"); if (d.open) d.close(); }

async function openBuy(ev, s, keep){
  if (!keep || !B || B.s.id !== s.id) B = {ev, s, seats:new Map(), items:new Map()};
  const mode = modeFor(ev, s);
  if (mode === "seats") return openSeats();
  if (mode === "zones") return openZones();
  return openTypes();
}
function buyHead(){
  const {ev, s} = B;
  return `<h3>${esc(title(ev))}</h3><p class="mini" style="margin:4px 0 0">${esc(longDate(s.date))}, ${hhmm(s.min)} · ${esc(vn(s.venue))}${s.hall ? ", " + esc(t("hallN", s.hall)) : ""}</p>`;
}
const selBar = () => `<div class="selbar"><div class="si" id="selinfo" aria-live="polite"></div>
  <div class="sbtns"><button class="btn alt" type="button" id="toCart" disabled>${ico("cart")}${esc(t("addCart"))}</button><button class="btn" type="button" id="toCheckout" disabled>${esc(t("buyNow"))}</button></div></div>
  <p class="mini holdnote">${esc(t(modeFor(B.ev, B.s) === "seats" ? "holdNote" : "cartNote"))}</p>`;
function bindSelBar(){
  $("#toCheckout").addEventListener("click", () => { if (selTotalQty()) addEventToCart(true); });
  $("#toCart").addEventListener("click", () => { if (selTotalQty()) addEventToCart(false); });
}
/* Tanlovni savatga qo'shish: aniq joylar serverda 10 daqiqaga band qilinadi */
async function addEventToCart(goCart){
  const {ev, s} = B, btns = [$("#toCart"), $("#toCheckout")];
  btns.forEach(b => b.disabled = true);
  const seats = [...B.seats.values()].sort((a, b) => a.row - b.row || a.seat - b.seat);
  const items = [...B.items.entries()].filter(([, q]) => q > 0).map(([k, qty]) => ({k, qty}));
  let holds = [];
  try {
    if (seats.length) holds = await holdSeats([{key:s.id, seats:seats.map(x => x.row + "-" + x.seat)}]);
  } catch (e) {
    btns.forEach(b => b.disabled = false);
    if (e.code === "seat_taken"){ toast(t("seatGone")); B.seats.clear(); openSeats(); return; }
    updSel(errText(e)); return;
  }
  Cart.add({type:"event", ev:ev.id, show:s.id, mode:modeFor(ev, s), seats, items, holds, total:selTotal()});
  B = null; closeDlg();
  if (goCart) location.hash = "#/cart"; else toast(t("addedCart"));
}
const selTotalQty = () => B.seats.size + [...B.items.values()].reduce((a, b) => a + b, 0);
const selTotal = () => [...B.seats.values()].reduce((a, x) => a + x.price, 0) + [...B.items.entries()].reduce((a, [k, q]) => a + itemPrice(k) * q, 0);
function itemPrice(k){ const tr = itemTier(k); return tr ? tr.price : 0; }
function itemTier(k){
  const {ev, s} = B;
  if (modeFor(ev, s) === "zones"){ const sec = sectorsOf(ev).find(x => x.id === k); return sec ? {label:sec.id === "FAN" ? t("s_fan") : t("sectorN", sec.id) + " · " + t("s_" + sec.cls), price:P(s.base, SEC_CLASS[sec.cls].m), color:SEC_CLASS[sec.cls].c} : null; }
  return tiers(ev, s).find(x => x.k === k);
}
function updSel(warn){
  const n = selTotalQty();
  $("#selinfo").innerHTML = (warn ? `<span class="left">${esc(warn)}</span><br>` : "") +
    (n ? `<b>${esc(t("ticketsN", n))} · ${esc(money(selTotal()))}</b>${B.seats.size ? `<br><span class="mini">${esc(seatsText([...B.seats.values()]))}</span>` : ""}`
       : `<span class="mini">${esc(t(modeFor(B.ev, B.s) === "seats" ? "hintSeats" : modeFor(B.ev, B.s) === "zones" ? "hintSector" : "hintTypes"))}</span>`);
  $("#toCheckout").disabled = $("#toCart").disabled = !n;
}
function seatsText(seats){
  const byRow = {};
  seats.slice().sort((a, b) => a.row - b.row || a.seat - b.seat).forEach(x => (byRow[x.row] = byRow[x.row] || []).push(x.seat));
  return Object.keys(byRow).map(r => `${t("rowN", r)}: ${byRow[r].join(", ")}`).join(" · ");
}

/* --- Zal sxemasi (hallLayout va mockOccupied — umumiy mantiqda) ---
   Band joylar: namunaviy sotilganlar + serverdagi sotilgan/band qilinganlar + savatingizdagilar */
async function takenOf(key){
  try { return (await api("GET", "seats", {show:key})).taken || []; } catch (e) { return []; }
}
const cartSeatsOf = key => Cart.items.filter(x => x.type === "event" && x.show === key).flatMap(x => x.seats.map(z => z.row + "-" + z.seat));
async function openSeats(){
  const {ev, s} = B;
  const type = vtOf(ev, s);
  const rows = hallLayout(type, s.base), occ = mockOccupied(s.id, rows);
  (await takenOf(s.id)).forEach(k => occ.add(k));
  cartSeatsOf(s.id).forEach(k => occ.add(k));
  if (!B || B.s !== s) return;
  [...B.seats.keys()].forEach(k => { if (occ.has(k)) B.seats.delete(k); });
  let last = "", hall = `<div class="screen">${esc(t(type === "cinema" ? "screen" : "stage"))}</div>`;
  rows.forEach(row => {
    if (row.zone !== last){ hall += `<div class="zl">${esc(t("z_" + row.zone))} · ${esc(money(row.price))}</div>`; last = row.zone; }
    let seats = "";
    for (let k = 1; k <= row.n; k++){
      const key = row.row + "-" + k, taken = occ.has(key);
      seats += `<button type="button" class="seat${k === Math.floor(row.n / 2) + 1 ? " gap" : ""}" style="--zc:${row.color}" data-k="${key}" data-r="${row.row}" data-s="${k}" data-z="${row.zone}" data-p="${row.price}" aria-pressed="${B.seats.has(key)}" ${taken ? "disabled" : ""} aria-label="${esc(t("seatN", row.row, k))}, ${esc(taken ? t("taken") : money(row.price))}">${k}</button>`;
    }
    hall += `<div class="hrow"><span class="rl">${row.row}</span><div class="seats">${seats}</div><span class="rl">${row.row}</span></div>`;
  });
  const zones = SEAT_ZONES[type];
  openDlg(`${buyHead()}
    <div class="hallwrap"><div class="hall">${hall}</div></div>

  let fieldArt;

  else if (g === "basketball") fieldArt = `<rect x="110" y="80" width="200" height="140" rx="6" fill="#D97706"/><rect x="118" y="88" width="184" height="124" fill="none" stroke="#fff" stroke-width="2" opacity=".85"/><path d="M210 88V212" stroke="#fff" stroke-width="2" opacity=".85"/><circle cx="210" cy="150" r="18" fill="none" stroke="#fff" stroke-width="2" opacity=".85"/><path d="M118 125h26v50h-26M302 125h-26v50h26" fill="none" stroke="#fff" stroke-width="2" opacity=".85"/>`;
  else if (g === "boxing") fieldArt = `<rect x="110" y="80" width="200" height="140" rx="6" fill="#334155"/><rect x="165" y="105" width="90" height="90" fill="#E5E7EB"/><rect x="165" y="105" width="90" height="90" fill="none" stroke="#DC2626" stroke-width="4"/><rect x="171" y="111" width="78" height="78" fill="none" stroke="#2563EB" stroke-width="2"/>`;
  else if (vt === "arena") fieldArt = `<rect x="110" y="80" width="200" height="140" rx="70" fill="#4A22C9"/><circle cx="210" cy="150" r="46" fill="#6D3BF5"/><circle cx="210" cy="150" r="30" fill="#E8A317"/>`;
  else fieldArt = `<rect x="110" y="80" width="200" height="140" rx="6" fill="#16A34A"/><g fill="none" stroke="#fff" stroke-width="2" opacity=".85"><rect x="118" y="88" width="184" height="124"/><path d="M210 88V212"/><circle cx="210" cy="150" r="20"/><rect x="118" y="122" width="24" height="56"/><rect x="278" y="122" width="24" height="56"/></g>`;
  const secs = sectorsOf(ev).map(x => {
    const out = so.has(x.id), cl = SEC_CLASS[x.cls], on = B.items.has(x.id);
    const pr = P(s.base, cl.m), lbl = x.id === "FAN" ? t("s_fan") : t("sectorN", x.id) + " · " + t("s_" + x.cls);
    const fill = out ? "#9CA3AF" : cl.c;
    return `<g class="sec-g${on ? " on" : ""}${out ? " out" : ""}" data-sec="${x.id}" role="button" tabindex="${out ? -1 : 0}" aria-pressed="${on}" aria-disabled="${out}" aria-label="${esc(lbl)}, ${esc(out ? t("soldOut") : money(pr))}">
      <rect x="${x.x}" y="${x.y}" width="${x.w}" height="${x.h}" rx="${x.id === "FAN" ? 10 : 8}" fill="${fill}" opacity="${x.id === "FAN" ? .85 : 1}"/>
      <text x="${x.x + x.w / 2}" y="${x.y + x.h / 2 - (x.id === "FAN" ? 2 : 3)}" text-anchor="middle" font-size="${x.id === "FAN" ? 13 : 16}" font-weight="800" fill="#fff">${x.id === "FAN" ? "FAN" : x.id}</text>
      <text x="${x.x + x.w / 2}" y="${x.y + x.h / 2 + 13}" text-anchor="middle" font-size="10" font-weight="600" fill="#fff" opacity=".95">${out ? esc(t("soldShort")) : Math.round(pr / 1000) + "k"}</text>
    </g>`;
  }).join("");
  return `<svg class="stad" viewBox="0 0 420 300" role="group" aria-label="${esc(t("hintSector"))}">
    <rect x="30" y="10" width="360" height="280" rx="60" fill="none" stroke="var(--line)" stroke-width="2"/>
    ${ev.fan ? `<rect x="150" y="80" width="160" height="140" rx="10" fill="#9B7BFF" opacity=".18"/>` : ""}
    ${fieldArt}${secs}</svg>`;
}
function openZones(){

  openDlg(`${buyHead()}<div id="stadBox">${stadiumSvg(ev, s)}</div>
    <div class="legend">${(ev.fan ? ["vip","center","fan","side","end"] : ["vip","center","side","end"]).map(c => `<span><i style="--zc:${SEC_CLASS[c].c};background:${SEC_CLASS[c].c}"></i>${esc(t("s_" + c))}</span>`).join("")}<span><i style="background:#9CA3AF;border-color:#9CA3AF"></i>${esc(t("soldOut"))}</span></div>

function drawZones(){

function openTypes(){

function drawTypes(){

function qtyRow(k, tr){
  const q = B.items.get(k) || 0, full = selTotalQty() >= 10;
  return `<div class="qrow"><i style="background:${tr.color}"></i><div><b>${esc(tr.label)}</b>${tr.desc ? `<small>${esc(tr.desc)}</small>` : ""}</div>
    <span class="p">${esc(money(tr.price))}</span>

}
function bindSteppers(redraw){
  $$("[data-inc]").forEach(b => b.addEventListener("click", () => { if (selTotalQty() >= 10) return; const k = b.dataset.inc; B.items.set(k, (B.items.get(k) || 0) + 1); redraw(); focusAgain("data-inc", k); }));
  $$("[data-dec]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.dec, q = (B.items.get(k) || 0) - 1;
    if (q <= 0){ if (modeFor(B.ev, B.s) === "zones") B.items.delete(k); else B.items.set(k, 0); } else B.items.set(k, q);
    if (modeFor(B.ev, B.s) !== "zones" && !B.items.get(k)) B.items.delete(k);
    redraw(); focusAgain("data-dec", k);
  }));
}
function focusAgain(attr, k){ const el = $(`[${attr}="${CSS.escape(k)}"]`); if (el && !el.disabled) el.focus(); else { const o = $(`[data-inc="${CSS.escape(k)}"]`); if (o) o.focus(); } }

/* --- Tanlangan narsalar matni (savat, chiptalar) --- */
function unitLabel(ev, k, kind){
  if (kind === "zones" || kind === "sector"){ const sec = ev && sectorsOf(ev).find(x => x.id === k); return sec ? (sec.id === "FAN" ? t("s_fan") : t("sectorN", sec.id) + " · " + t("s_" + sec.cls)) : k; }
  return t("ty_" + k);
}
function itemLines(it){
  if (it.seats && it.seats.length) return seatsText(it.seats);
  return (it.items || []).map(x => `${unitLabel(EV[it.ev], x.k, it.mode)} × ${x.qty}`).join(", ");
}
/* --- Fayl yuklab berish --- */
function download(blob, name){
  try {
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (e) { toast(t("dlFail")); }
}
/* --- Kalendar (.ics) --- */
function downloadIcs(ev, s, code){
  /* Tadbirlar O'zbekistonda (UTC+5, yozgi vaqt yo'q) — UTC ga o'tkazamiz */
  const dt = (date, min) => { const [y, m, d] = date.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d, 0, min - 300)).toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z"; };
  const endMin = s.min + (ev.dur || 120);
  const e = x => String(x).replace(/\\/g, "\\\\").replace(/[,;]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Go-Chipta//Demo//UZ","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    "UID:" + (code || "S" + seed(ev.id + s.date + s.min)) + "-" + ev.id + "@go-chipta.demo", "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z",
    "DTSTART:" + dt(s.date, s.min), "DTEND:" + dt(s.date, endMin), "SUMMARY:" + e(title(ev)),
    "LOCATION:" + e(vn(s.venue) + ", " + cn(VENUES[s.venue].city)), "END:VEVENT","END:VCALENDAR"].join("\r\n");
  download(new Blob([ics], {type:"text/calendar"}), (ev.id + "-" + s.date) + ".ics");
}


/* =====================================================================
   CHIPTALAR: matnlar va PDF.
   PDF kirill harflarini ham to'g'ri ko'rsatadi: chipta dizayni canvas'da
   chiziladi (JPEG), QR kod esa ustidan vektor ko'rinishida qo'yiladi —
   shuning uchun skaner uni har doim aniq o'qiydi.
   ===================================================================== */
const tkTitle = (tk, lg) => tk.kind === "event" ? ((tk.title && (tk.title[lg || S.lang] || tk.title.uz)) || "—") : `${cn(tk.from, lg)} → ${cn(tk.to, lg)}`;
const tkWhen = tk => tk.kind === "event"
  ? `${nice(tk.date)}, ${hhmm(tk.min)} · ${vn(tk.venue)}${tk.hall ? ", " + t("hallN", tk.hall) : ""}`
  : `${nice(tk.date)}, ${tk.depAt.slice(11, 16)} – ${tk.arrAt.slice(11, 16)} · ${tk.carrier} ${tk.flight}`;
function tkSeat(tk){
  if (tk.kind === "event") return tk.seat ? `${t("seatN", tk.seat.row, tk.seat.seat)} · ${t("z_" + tk.seat.zone)}` : unitLabel(EV[tk.ev], tk.unit.k, tk.unit.kind);
  return [`${tk.pax.s} ${tk.pax.n}`.toUpperCase(), clsName(tk.mode, tk.cls), tk.seatKey ? seatLabel(tk.seatKey) : "", tk.tariff ? t("tf_" + tk.tariff) : ""].filter(Boolean).join(" · ");
}
const tkStart = tk => tk.kind === "event" ? {date:tk.date, min:tk.min} : {date:tk.date, min:depMinOf(tk.depAt)};
const tkMinsLeft = tk => { const s = tkStart(tk); return minutesUntil(s.date, s.min, tzIso(), tzMin()); };

/* ---------- PDF ---------- */
const PX = 8;   // 1 mm = 8 px (canvas)
function b64bytes(dataUrl){ const b = atob(dataUrl.split(",")[1]); const a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
function fitText(ctx, txt, maxW, size, weight, minSize){
  let s = size;
  for (; s > (minSize || 20); s -= 2){ ctx.font = `${weight} ${s}px Onest, "Segoe UI", Roboto, Arial, sans-serif`; if (ctx.measureText(txt).width <= maxW) return txt; }
  let out = txt; while (out.length > 1 && ctx.measureText(out + "…").width > maxW) out = out.slice(0, -1);
  return out === txt ? txt : out + "…";
}
function ticketCanvas(tk, idx, total){
  const W = 200 * PX, H = 84 * PX, c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d"), F = (w, s) => `${w} ${s}px Onest, "Segoe UI", Roboto, Arial, sans-serif`;
  const ink = "#10223B", mute = "#5B6B82", brand = "#6D3BF5";
  x.fillStyle = "#fff"; x.fillRect(0, 0, W, H);
  /* yuqori lenta */
  const g = x.createLinearGradient(0, 0, W, 0); g.addColorStop(0, brand); g.addColorStop(1, "#4A22C9");
  x.fillStyle = g; x.fillRect(0, 0, W, 16 * PX);
  x.fillStyle = "#fff"; x.font = F(800, 56); x.textBaseline = "alphabetic"; x.fillText(CONFIG.BRAND, 8 * PX, 10.6 * PX);
  x.font = F(500, 34); x.textAlign = "right";
  x.fillText(`${t(tk.kind === "event" ? "pdfTicket" : tk.mode === "avia" ? "pdfAvia" : "pdfTrain")}${total > 1 ? `  ${idx + 1}/${total}` : ""}`, W - 8 * PX, 10.3 * PX);
  x.textAlign = "left";
  /* yirtiladigan chiziq */
  x.strokeStyle = "#CDD2E0"; x.lineWidth = 3; x.setLineDash([16, 16]); x.beginPath(); x.moveTo(140 * PX, 20 * PX); x.lineTo(140 * PX, 80 * PX); x.stroke(); x.setLineDash([]);
  const L = 8 * PX, maxW = 126 * PX;
  const box = (bx, by, bw, label, val) => {
    x.strokeStyle = "#CDD2E0"; x.lineWidth = 3;
    x.beginPath(); x.roundRect ? x.roundRect(bx, by, bw, 15 * PX, 16) : x.rect(bx, by, bw, 15 * PX); x.stroke();
    x.fillStyle = mute; x.font = F(500, 26); x.fillText(fitText(x, label, bw - 30, 26, 500), bx + 20, by + 5 * PX);
    x.fillStyle = ink; const v = fitText(x, val, bw - 36, 46, 700, 26); x.fillText(v, bx + 20, by + 12.2 * PX);
  };
  if (tk.kind === "event"){
    const ev = EV[tk.ev];
    x.fillStyle = mute; x.font = F(500, 30);
    x.fillText(fitText(x, [catName(tk.cat), ev ? gn(ev.genre) : "", ev ? ev.age : "", tk.dur ? durTxt(tk.dur) : ""].filter(Boolean).join("  ·  "), maxW, 30, 500), L, 24 * PX);
    x.fillStyle = ink; x.fillText(fitText(x, tkTitle(tk), maxW, 64, 800, 34), L, 32 * PX);
    x.fillStyle = ink; x.font = F(500, 34);
    x.fillText(fitText(x, `${vn(tk.venue)}${tk.hall ? ", " + t("hallN", tk.hall) : ""}${VENUES[tk.venue] ? ", " + cn(VENUES[tk.venue].city) : ""}`, maxW, 34, 500), L, 39 * PX);
    const bx = [[t("pdfDate"), nice(tk.date)], [t("pdfTime"), hhmm(tk.min)]];
    if (tk.seat) bx.push([t("pdfRow"), String(tk.seat.row)], [t("pdfSeat"), String(tk.seat.seat)]);
    else bx.push([t(tk.unit.kind === "sector" ? "pdfSector" : "pdfType"), unitLabel(ev, tk.unit.k, tk.unit.kind)]);
    const ws = bx.length === 4 ? [40, 22, 30, 26] : [40, 22, 58];
    let bxX = L; bx.forEach((b, j) => { box(bxX, 44 * PX, ws[j] * PX, b[0], b[1]); bxX += (ws[j] + 3) * PX; });
    x.fillStyle = mute; x.font = F(500, 30);
    if (tk.seat) x.fillText(t("z_" + tk.seat.zone), L, 67 * PX);
  } else {
    x.fillStyle = mute; x.font = F(500, 30);
    x.fillText(fitText(x, `${tk.carrier}  ${tk.flight}  ·  ${clsName(tk.mode, tk.cls)}${tk.legs > 1 ? "  ·  " + t(tk.li ? "legBack" : "legOut") : ""}`, maxW, 30, 500), L, 24 * PX);
    x.fillStyle = ink; x.font = F(800, 90);
    x.fillText(tk.depAt.slice(11, 16), L, 37 * PX); x.textAlign = "right"; x.fillText(tk.arrAt.slice(11, 16), 134 * PX, 37 * PX); x.textAlign = "left";
    x.font = F(500, 32);
    x.fillText(fitText(x, `${cn(tk.from)} (${CITIES[tk.from].code})`, 60 * PX, 32, 500), L, 43 * PX);
    x.textAlign = "right"; x.fillText(fitText(x, `${cn(tk.to)} (${CITIES[tk.to].code})`, 60 * PX, 32, 500), 134 * PX, 43 * PX); x.textAlign = "left";
    x.strokeStyle = "#CDD2E0"; x.lineWidth = 4; x.beginPath(); x.moveTo(45 * PX, 32 * PX); x.lineTo(95 * PX, 32 * PX); x.stroke();
    x.fillStyle = mute; x.font = F(500, 26); x.textAlign = "center"; x.fillText(durTxt(tk.dur || 0), 70 * PX, 29.5 * PX); x.textAlign = "left";
    const st = tk.seatKey || "";
    box(L, 47 * PX, 34 * PX, t("pdfDate"), nice(tk.date));
    box(45 * PX, 47 * PX, 54 * PX, t("pdfPass"), `${tk.pax.s} ${tk.pax.n}`.toUpperCase());
    box(102 * PX, 47 * PX, 32 * PX, t(st.includes("-") ? "pdfWagonSeat" : "pdfSeat"), st ? st.replace("-", " / ") : "—");
    x.fillStyle = mute; x.font = F(500, 28);
    x.fillText(fitText(x, `${t("pdfPassport")}: ${tk.pax.p}${tk.tariff ? "   ·   " + t("tariffLbl") + ": " + t("tf_" + tk.tariff) : ""}`, maxW, 28, 500), L, 68 * PX);
  }
  x.fillStyle = "#B4520B"; x.font = F(500, 24);
  x.fillText(fitText(x, t(tk.status === "pending" ? "pdfPending" : S.payment === "demo" ? "pdfDemo" : "pdfValid"), maxW, 24, 500, 16), L, 77 * PX);
  /* o'ng qism (QR shu yerga vektor bo'lib chiziladi) */
  x.fillStyle = mute; x.font = F(500, 24); x.fillText(t("pdfTicketNo"), 148 * PX, 59 * PX);
  x.fillStyle = ink; x.font = F(800, 48); x.fillText(tk.id, 148 * PX, 66 * PX);
  x.fillStyle = mute; x.font = F(500, 28); x.fillText(fitText(x, `${t("pdfPrice")}: ${money(tk.paid)}`, 46 * PX, 28, 500), 148 * PX, 72 * PX);
  x.font = F(500, 24); x.fillText(fitText(x, `${t("pdfOrder")}: ${tk.code}`, 46 * PX, 24, 500), 148 * PX, 77 * PX);
  return c;
}
async function ticketsPdf(list, name){
  if (!list || !list.length){ toast(t("dlFail")); return; }
  try {
    if (document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, sleep(1500)]);
    const doc = new MiniPDF.Doc(200, 84);
    list.forEach((tk, i) => {
      if (i) doc.addPage();
      const c = ticketCanvas(tk, i, list.length);
      doc.jpeg(b64bytes(c.toDataURL("image/jpeg", 0.9)), c.width, c.height, 0, 0, 200, 84);
      doc.fill([255,255,255]).rect(146, 18, 38, 38);
      doc.qr(tk.qr, 148, 20, 34);
    });
    download(doc.blob(), (name || "chipta-" + list[0].id) + ".pdf");
  } catch (e) { console.error(e); toast(t("dlFail")); }
}

async function doRefund(btn){

  if (!btn.dataset.sure){ btn.dataset.sure = "1"; btn.textContent = t("refundSure", money(amount)); setTimeout(() => { if (btn.isConnected){ delete btn.dataset.sure; btn.textContent = t("refundBtn", pct); } }, 6000); return; }
  btn.disabled = true;
  try { const r = await api("POST", "tickets/" + tk.id + "/refund"); toast(t("refundDone", money(r.amount))); loadOrders(); }
  catch (e) { btn.disabled = false; toast(errText(e)); }
}

/* Poster rasmini 600×900 JPEG ga kichraytirish (≤ 700 KB) */
function resizePoster(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const W = 600, H = 900, c = document.createElement("canvas"); c.width = W; c.height = H;
      const k = Math.max(W / img.width, H / img.height), w = img.width * k, h = img.height * k;
      c.getContext("2d").drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
      URL.revokeObjectURL(url);
      let q = .85, out = c.toDataURL("image/jpeg", q);
      while (out.length > 690000 && q > .4){ q -= .1; out = c.toDataURL("image/jpeg", q); }
      out.length > 690000 ? rej(new Error("big")) : res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src = url;
  });
}

/* =====================================================================
   KIRISH NAZORATI: QR skaner (xodim / admin uchun)
   Kamera — BarcodeDetector API (Chrome, Edge, Android). Qolgan brauzerlarda
   chipta raqamini qo'lda kiritish mumkin.
   ===================================================================== */
const SCAN = {stream:null, timer:0, last:"", lastAt:0, hist:[], busy:false};
function stopScan(){
  clearTimeout(SCAN.timer); SCAN.timer = 0;
  if (SCAN.stream){ SCAN.stream.getTracks().forEach(tr => tr.stop()); SCAN.stream = null; }
}
function viewScan(){
  const deny = needRole(["staff","admin"], t("scanT")); if (deny) return deny;
  const cam = "BarcodeDetector" in window && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  return `<div class="wrap scan"><section class="phead"><h1>${esc(t("scanT"))}</h1><p>${esc(t("scanSub"))}</p></section>
    <div class="scangrid">
      <div class="card">
        ${cam ? `<div class="cam"><video id="camv" playsinline muted></video><div class="camframe" aria-hidden="true"></div><button class="btn" type="button" id="camBtn">${ico("qr")}${esc(t("camStart"))}</button></div>`
              : `<p class="mini">${esc(t("camNo"))}</p>`}
        <form id="scform" class="inrow" novalidate><input id="scin" autocomplete="off" autocapitalize="characters" placeholder="${esc(t("scanPh"))}" aria-label="${esc(t("scanPh"))}"><button class="btn" type="submit">${esc(t("check"))}</button></form>
      </div>
      <div><div id="scres" class="scres" aria-live="assertive"><p class="mini">${esc(t("scanWait"))}</p></div>
        <h3 class="sh">${esc(t("scanHist"))}</h3><ol id="schist" class="schist">${SCAN.hist.map(histRow).join("")}</ol></div>
    </div></div>`;
}
function bindScan(){
  bindRoleLogin();
  if (!isRole("staff", "admin")) return;
  $("#scform").addEventListener("submit", e => { e.preventDefault(); const v = $("#scin").value.trim(); if (v) checkTicket(v); });
  const cb = $("#camBtn"); if (cb) cb.addEventListener("click", () => SCAN.stream ? (stopScan(), cb.innerHTML = ico("qr") + esc(t("camStart"))) : startCam());
}
async function startCam(){
  const v = $("#camv"), cb = $("#camBtn");
  try {
    SCAN.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}, audio:false});
    v.srcObject = SCAN.stream; await v.play();
    cb.innerHTML = esc(t("camStop"));
    const det = new BarcodeDetector({formats:["qr_code"]});
    const loop = async () => {
      if (!SCAN.stream || !v.isConnected) return stopScan();
      try { const r = await det.detect(v); if (r[0] && r[0].rawValue) checkTicket(r[0].rawValue); } catch (e) {}
      SCAN.timer = setTimeout(loop, 280);
    };
    loop();
  } catch (e) { stopScan(); toast(t("camFail")); }
}
const SC_CLS = {ok:"ok", used:"warn", wrong_day:"warn", invalid:"bad", refunded:"bad", cancelled:"bad", pending:"bad"};
async function checkTicket(raw, force){
  const now = Date.now();
  if (!force && raw === SCAN.last && now - SCAN.lastAt < 4000) return;
  if (SCAN.busy) return;
  SCAN.busy = true; SCAN.last = raw; SCAN.lastAt = now;
  let r;
  try { r = await api("POST", "scan", {qr:raw, force:!!force}); }
  catch (e) { SCAN.busy = false; toast(errText(e)); return; }
  SCAN.busy = false;
  if (navigator.vibrate) navigator.vibrate(r.result === "ok" ? 80 : [60, 60, 60]);
  const box = $("#scres"); if (!box) return;
  const tk = r.ticket;
  box.className = "scres " + (SC_CLS[r.result] || "bad");
  box.innerHTML = `<div class="big">${r.result === "ok" ? "✓" : r.result === "invalid" ? "✕" : "!"}</div><h2>${esc(t("sc_" + r.result))}</h2>
    ${tk ? `<p><b>${esc(tkTitle(tk))}</b></p><p>${esc(tk.kind === "event" ? `${nice(tk.date)}, ${hhmm(tk.min)} · ${vn(tk.venue)}` : `${nice(tk.date)}, ${tk.depAt.slice(11, 16)} · ${tk.carrier} ${tk.flight}`)}</p>
      <p>${esc(tk.kind === "event" ? (tk.seat ? t("seatN", tk.seat.row, tk.seat.seat) : unitLabel(EV[tk.ev], tk.unit.k, tk.unit.kind)) : `${tk.pax.s} ${tk.pax.n}`.toUpperCase() + (tk.seatKey ? " · " + seatLabel(tk.seatKey) : ""))}</p>
      <p class="mini">${esc(t("pdfTicketNo"))}: ${esc(tk.id)} · ${esc(tk.buyer)} ${esc(tk.phone)}</p>
      ${r.result === "used" && r.usedAt ? `<p class="mini">${esc(t("usedAt", new Date(r.usedAt).toLocaleString("ru-RU")))}</p>` : ""}
      ${r.result === "wrong_day" ? `<button class="btn" type="button" id="scForce">${esc(t("scForce"))}</button>` : ""}` : ""}`;
  const fb = $("#scForce"); if (fb) fb.addEventListener("click", () => checkTicket(raw, true));
  SCAN.hist.unshift({res:r.result, title:tk ? tkTitle(tk) : raw.slice(0, 24), id:tk ? tk.id : "", at:new Date().toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit", second:"2-digit"})});
  SCAN.hist = SCAN.hist.slice(0, 30);
  const h = $("#schist"); if (h) h.innerHTML = SCAN.hist.map(histRow).join("");
  const inp = $("#scin"); if (inp){ inp.value = ""; }
}
const histRow = x => `<li><span class="st ${SC_CLS[x.res] || "bad"}">${esc(t("sc_" + x.res))}</span> <b>${esc(x.title)}</b> <small>${esc(x.id)} · ${esc(x.at)}</small></li>`;

    <article class="card">${x.s.map(([h, p]) => `<h2>${esc(h)}</h2><p>${p}</p>`).join("")}<p class="mini">${esc(t("legalUpd"))}</p></article></div>`;

/* =====================================================================
   SAYOHAT: avia va poyezd
   Taklif shakli (server.js /api/flights ham shu asosiy maydonlarni qaytaradi):
   { id, carrier, code, depAt:"YYYY-MM-DDTHH:MM", arrAt, dur, stops, seats, price (1 kishi), currency }
   Namunaviy ma'lumotda qo'shimcha: hub, layover, aircraft (avia); classes, amen (poyezd).
   ===================================================================== */
const T = {
  avia:  {from:"Toshkent", to:"Istanbul", date:isoAdd(7), ret:"", pax:1, cls:0, searched:false},
  poyezd:{from:"Toshkent", to:"Samarqand", date:isoAdd(7), ret:"", pax:1, cls:0, searched:false},
  sort:"best", direct:false, carrier:"", tod:new Set(), open:new Set(),
  leg:0, picked:null, results:[], key:"", mode:"avia", pending:null
};
let trSeq = 0;
const withDepMin = o => { o.depMin = depMinOf(o.depAt); return o; };
const trMinPrice = (m, a, b, date) => { const l = mockGen(m, a, b, date, 0); return l.length ? Math.min(...l.map(x => x.price)) : null; };
async function apiFlights(q){
  const r = await api("GET", "flights", {from:q.from, to:q.to, date:q.date, adults:String(q.pax), cls:q.cls === 1 ? "BUSINESS" : "ECONOMY"});
  return (r.offers || []).map(withDepMin);
}
async function trSearchOffers(mode, q){
  let list;
  if (mode === "avia" && S.api) list = await apiFlights(q);
  else { await sleep(350); list = mockGen(mode, q.from, q.to, q.date, q.cls); }
  /* bugun allaqachon jo'nab ketgan (yoki 1 soatdan kam qolgan) reyslar ko'rsatilmaydi */
  return availOf(list, q.date, 1, "");
}
/* Ro'yxatdagi bilan bir xil qoidalar: bugun jo'nab ketganlar, qaytishda vaqt sharti, yo'lovchilar soniga yetarli joy */
function availOf(list, date, pax, after){
  const nm = nowMin();
  return list.filter(x => (date !== TODAY_ISO || x.depAt.slice(0, 10) > TODAY_ISO || x.depMin > nm + 60) && (!after || x.depAt >= after) && (x.seats == null || x.seats >= (pax || 1)));
}
const dayMin = (mode, from, to, date, cls, pax, after) => { if (S.api && mode === "avia") return null; const l = availOf(mockGen(mode, from, to, date, cls), date, pax, after); return l.length ? Math.min(...l.map(x => x.price)) : null; };
const Q = () => T.q || {cls:T[T.mode].cls, pax:T[T.mode].pax};
const afterIso = () => T.leg === 1 && T.picked ? new Date(Date.parse(T.picked.arrAt + ":00Z") + 2 * 3600e3).toISOString().slice(0, 16) : "";
const clsName = (mode, i, lg) => TR_CLASSES[mode][lg || S.lang][i];
const curLeg = () => { const F = T[T.mode]; return T.leg === 0 ? {from:F.from, to:F.to, date:F.date} : {from:F.to, to:F.from, date:F.ret}; };
const shortPrice = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(".", S.lang === "en" ? "." : ",") + t("mln") : Math.round(n / 1000) + "k";
const estDur = (mode, a, b) => { const km = dist(CITIES[a], CITIES[b]); if (mode === "avia") return Math.round((45 + km / 13) / 5) * 5; const fast = FAST_TRAIN.has(a) && FAST_TRAIN.has(b); return Math.round((km * 1.25 / (fast ? 150 : 70) * 60 + 20) / 5) * 5; };

/* ---------- Marshrut xaritasi ---------- */
function routeMap(mode, from, to){
  const W = 640, H = 270, pad = 34;
  const names = Object.keys(CITIES).filter(n => CITIES[n][mode === "avia" ? "air" : "train"]);
  const intl = mode === "avia" && (!CITIES[from].uz || !CITIES[to].uz);
  let bb = {lo0:57.5, lo1:74.5, la0:36.2, la1:44};
  if (intl){
    /* xalqaro yo'nalish: ikki shahar atrofidagi hududni xarita nisbatida (W:H) olamiz */
    const A = CITIES[from], B = CITIES[to];
    let lo0 = Math.min(A.lo, B.lo), lo1 = Math.max(A.lo, B.lo), la0 = Math.min(A.la, B.la), la1 = Math.max(A.la, B.la);
    let wl = (lo1 - lo0) * 1.3 + 6, hl = (la1 - la0) * 1.5 + 6;
    const ratio = (W - 2 * pad) / (H - 2 * pad);
    if (wl / hl < ratio) wl = hl * ratio; else hl = wl / ratio;
    const cl = (lo0 + lo1) / 2, ca = (la0 + la1) / 2 + hl * .08;
    bb = {lo0:cl - wl / 2, lo1:cl + wl / 2, la0:ca - hl / 2, la1:ca + hl / 2};
  }
  const P = c => [pad + (c.lo - bb.lo0) / (bb.lo1 - bb.lo0) * (W - 2 * pad), pad + (bb.la1 - c.la) / (bb.la1 - bb.la0) * (H - 2 * pad)];
  const [x1, y1] = P(CITIES[from]), [x2, y2] = P(CITIES[to]);
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  const bend = Math.min(90, len * .35);
  let cx = mx + dy / len * bend, cy = my - dx / len * bend;
  if (cy > my) { cx = mx - dy / len * bend; cy = my + dx / len * bend; }
  const path = `M${x1.toFixed(1)} ${y1.toFixed(1)}Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
  let grid = "";
  for (let i = 1; i < 8; i++) grid += `<path d="M${W * i / 8} 0V${H}" /><path d="M0 ${H * i / 8 * (8 / 8)}H${W}" opacity="${i < 8 ? 1 : 0}"/>`;
  const inBox = c => c.lo >= bb.lo0 && c.lo <= bb.lo1 && c.la >= bb.la0 && c.la <= bb.la1;
  const dots = names.filter(n => (intl || CITIES[n].uz) && inBox(CITIES[n])).map(n => {
    const [x, y] = P(CITIES[n]), on = n === from || n === to;
    const lbl = on || !intl;
    const leftLbl = n === "Namangan" || (on && x > W - 150);
    return `<g class="${on ? "on" : ""}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${on ? 6 : 3}"/>${lbl ? `<text x="${(x + (leftLbl ? -1 : 1) * (on ? 10 : 6)).toFixed(1)}" y="${(y + (n === "Namangan" ? -5 : 4)).toFixed(1)}"${leftLbl ? ' text-anchor="end"' : ""}>${esc(on ? cn(n) + " · " + CITIES[n].code : cn(n))}</text>` : ""}</g>`;
  }).join("");
  const mover = mode === "avia"
    ? `<path d="M11 0L-7 -7L-3 0L-7 7Z" fill="#fff"/>`
    : `<rect x="-9" y="-5" width="18" height="10" rx="4" fill="#fff"/><rect x="-5" y="-3" width="4" height="3" rx="1" fill="${CAT_COLOR.poyezd}"/><rect x="1" y="-3" width="4" height="3" rx="1" fill="${CAT_COLOR.poyezd}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="rmap" role="img" aria-label="${esc(cn(from))} → ${esc(cn(to))}">
    <g class="grid" stroke="rgba(255,255,255,.08)">${grid}</g>
    ${from !== to ? `<path d="${path}" class="arc-bg"/><path d="${path}" class="arc"/>` : ""}
    ${dots}
    ${from !== to ? `<g class="mover">${mover}<animateMotion dur="${Math.max(3.5, len / 90).toFixed(1)}s" repeatCount="indefinite" rotate="auto" path="${path}"/></g>` : ""}
  </svg>`;
}
function routeStats(mode, from, to){
  const km = Math.round(dist(CITIES[from], CITIES[to]) * (mode === "poyezd" ? 1.25 : 1) / 10) * 10;
  return `<span>${ico("pin")}${esc(t("distKm", num(km)))}</span><span>${ico("clock")}${esc(t("approx"))} ${esc(durTxt(estDur(mode, from, to)))}</span>`;
}

/* ---------- Sahifa ---------- */
function viewTravel(mode){
  T.mode = mode;
  const F = T[mode], other = mode === "avia" ? "poyezd" : "avia";
  return `<div class="wrap">

          <nav class="tmodes" aria-label="${esc(t("trTabsAria"))}">
